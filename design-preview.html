<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cicli Aperti — Design preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500&family=Plus+Jakarta+Sans:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.31.0/dist/tabler-icons.min.css">
<style>
/* ============================================================
   TOKENS — nell'app vivono su :root / :root[data-theme="dark"].
   Qui sono agganciati a [data-theme] per mostrare i due temi affiancati.
   ============================================================ */
:root {
  --font-sans: "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;

  /* scala tipografica: 5 livelli */
  --fs-display: 28px; --lh-display: 34px;
  --fs-title: 20px;   --lh-title: 26px;
  --fs-body: 16px;    --lh-body: 24px;
  --fs-label: 14px;   --lh-label: 20px;
  --fs-caption: 12px; --lh-caption: 16px;
  --fw-regular: 500;
  --fw-strong: 700;

  /* spaziature: griglia a 4 */
  --sp-1: 4px; --sp-2: 8px; --sp-3: 12px; --sp-4: 16px;
  --sp-5: 24px; --sp-6: 32px; --sp-7: 48px;

  /* raggi */
  --r-sm: 8px; --r-md: 12px; --r-lg: 16px; --r-xl: 24px; --r-full: 999px;

  /* misure */
  --tap: 44px;
  --nav-h: 56px;

  /* movimento */
  --ease-out: cubic-bezier(.2, .8, .2, 1);
  --ease-pop: cubic-bezier(.3, 1.6, .5, 1);
  --t-fast: 120ms; --t-base: 200ms; --t-slow: 320ms;
}

[data-theme="light"] {
  color-scheme: light;
  --bg: #F5F7F6;
  --surface: #FFFFFF;
  --surface-2: #ECF0EE;
  --surface-3: #FFFFFF;
  --border: #DFE5E2;
  --border-strong: #84918C;
  --text: #14201D;
  --text-2: #46544F;
  --text-3: #5F6C67;
  --done-title: #5F6C67;
  --done-meta: #5F6C67;
  --done-opacity: .6;

  --primary: #0F766E;
  --primary-deep: #0A544E;
  --primary-ink: #0B5F58;
  --primary-soft: #DDF2EE;
  --on-primary: #FFFFFF;

  --q1: #B93C0B;  --q1-soft: #FCE9DF;
  --q2: #0B5F58;  --q2-soft: #DDF2EE;
  --q3: #4F4FC4;  --q3-soft: #E9E8FB;
  --q4: #5F6C67;  --q4-soft: #ECF0EE;

  --danger: #B42318; --danger-soft: #FCE8E6;
  --warn: #92500A;   --warn-soft: #FBEFD5;

  --inverse-bg: #14201D; --inverse-text: #FFFFFF; --inverse-accent: #5EEAD4;
  --scrim: rgba(20, 32, 29, .42);
  --ring: #0F766E;

  --shadow-1: 0 1px 2px rgba(20, 32, 29, .06);
  --shadow-2: 0 4px 12px rgba(20, 32, 29, .08), 0 1px 2px rgba(20, 32, 29, .05);
  --shadow-3: 0 16px 40px rgba(20, 32, 29, .16), 0 2px 6px rgba(20, 32, 29, .06);
}

[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0D1312;
  --surface: #161D1C;
  --surface-2: #202A28;
  --surface-3: #34413E;
  --border: #2A3533;
  --border-strong: #71807B;
  --text: #ECF1EF;
  --text-2: #B7C2BE;
  --text-3: #93A09B;
  /* nel tema scuro le cose fatte salgono di un livello: titolo su testo-2, dettagli su testo-3 pieni */
  --done-title: #B7C2BE;
  --done-meta: #93A09B;
  --done-opacity: 1;

  --primary: #2DD4BF;
  --primary-deep: #15988A;
  --primary-ink: #5EEAD4;
  --primary-soft: #12332F;
  --on-primary: #04201D;

  --q1: #FB8F63;  --q1-soft: #3A2015;
  --q2: #5EEAD4;  --q2-soft: #12332F;
  --q3: #AAA8F7;  --q3-soft: #272750;
  --q4: #93A09B;  --q4-soft: #202A28;

  --danger: #F98B82; --danger-soft: #3B1A17;
  --warn: #F5C261;   --warn-soft: #3A2C10;

  --inverse-bg: #ECF1EF; --inverse-text: #14201D; --inverse-accent: #0B5F58;
  --scrim: rgba(0, 0, 0, .6);
  --ring: #5EEAD4;

  /* nel tema scuro la profondità la danno le superfici, non le ombre */
  --shadow-1: 0 0 0 1px #2A3533;
  --shadow-2: 0 0 0 1px #2A3533, 0 6px 16px rgba(0, 0, 0, .4);
  --shadow-3: 0 0 0 1px #2A3533, 0 20px 48px rgba(0, 0, 0, .55);
}

/* ============================================================
   BASE
   ============================================================ */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; font-family: var(--font-sans); font-size: var(--fs-body); line-height: var(--lh-body); font-weight: var(--fw-regular); -webkit-font-smoothing: antialiased; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
h1, h2, h3, p { margin: 0; }
.ti { font-size: 20px; line-height: 1; }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }

.t-display { font-size: var(--fs-display); line-height: var(--lh-display); font-weight: var(--fw-strong); letter-spacing: -.02em; }
.t-title { font-size: var(--fs-title); line-height: var(--lh-title); font-weight: var(--fw-strong); letter-spacing: -.01em; }
.t-body { font-size: var(--fs-body); line-height: var(--lh-body); }
.t-label { font-size: var(--fs-label); line-height: var(--lh-label); }
.t-caption { font-size: var(--fs-caption); line-height: var(--lh-caption); }
.strong { font-weight: var(--fw-strong); }
.muted { color: var(--text-2); }
.faint { color: var(--text-3); }

/* ============================================================
   IMPALCATURA DELL'ANTEPRIMA (non fa parte del design system)
   ============================================================ */
.pv-bar { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; justify-content: space-between; gap: var(--sp-3); padding: var(--sp-2) var(--sp-4); background: var(--surface); color: var(--text); border-bottom: 1px solid var(--border); }
.pv-bar h1 { font-size: var(--fs-label); line-height: var(--lh-label); font-weight: var(--fw-strong); }
.pv-bar .seg { width: 176px; }
.pv-grid { display: grid; grid-template-columns: 1fr; }
.theme { background: var(--bg); color: var(--text); padding: var(--sp-5) var(--sp-4) var(--sp-7); min-width: 0; }
.pv-grid[data-show="light"] .theme[data-theme="dark"],
.pv-grid[data-show="dark"] .theme[data-theme="light"] { display: none; }
.theme-inner { max-width: 420px; margin: 0 auto; }
.theme-name { display: flex; align-items: center; gap: var(--sp-2); color: var(--text-2); margin-bottom: var(--sp-5); }
.pv-section { margin-bottom: var(--sp-7); }
.pv-section > h2 { font-size: var(--fs-title); line-height: var(--lh-title); font-weight: var(--fw-strong); letter-spacing: -.01em; margin-bottom: var(--sp-1); }
.pv-section > .pv-note { font-size: var(--fs-label); line-height: var(--lh-label); color: var(--text-2); margin-bottom: var(--sp-4); }
.pv-sub { font-size: var(--fs-caption); line-height: var(--lh-caption); font-weight: var(--fw-strong); color: var(--text-3); margin: var(--sp-5) 0 var(--sp-2); }
.pv-stack { display: grid; gap: var(--sp-3); }
.pv-row { display: flex; flex-wrap: wrap; gap: var(--sp-2); align-items: center; }
@media (min-width: 900px) {
  .pv-bar .seg { display: none; }
  .pv-grid { grid-template-columns: 1fr 1fr; }
  .pv-grid[data-show] .theme[data-theme] { display: block; }
  .theme { padding: var(--sp-6) var(--sp-6) var(--sp-7); }
}

/* ============================================================
   COMPONENTI
   ============================================================ */

/* --- Campioni colore e tipografia --- */
.swatches { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--sp-2); }
.swatch { border-radius: var(--r-md); border: 1px solid var(--border); background: var(--surface); overflow: hidden; }
.swatch i { display: block; height: 44px; border-bottom: 1px solid var(--border); }
.swatch b { display: block; padding: 6px var(--sp-2) 0; font-size: var(--fs-caption); line-height: var(--lh-caption); font-weight: var(--fw-strong); }
.swatch span { display: block; padding: 0 var(--sp-2) 6px; font-size: var(--fs-caption); line-height: var(--lh-caption); color: var(--text-2); }
.type-row { display: grid; grid-template-columns: 1fr auto; align-items: baseline; gap: var(--sp-3); padding: var(--sp-2) 0; border-bottom: 1px solid var(--border); }
.type-row:last-child { border-bottom: 0; }
.type-row .mono { color: var(--text-3); font-size: var(--fs-caption); }

/* --- Bottoni --- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: var(--sp-2); min-height: 48px; padding: 0 20px; border: 0; border-radius: var(--r-md); font-size: var(--fs-body); line-height: var(--lh-body); font-weight: var(--fw-strong); white-space: nowrap; background: transparent; color: var(--text); transition: transform var(--t-fast) var(--ease-out), box-shadow var(--t-fast) var(--ease-out), background-color var(--t-fast); -webkit-tap-highlight-color: transparent; }
.btn-primary { background: var(--primary); color: var(--on-primary); box-shadow: 0 3px 0 var(--primary-deep); }
.btn-primary:active { transform: translateY(3px); box-shadow: 0 0 0 var(--primary-deep); }
.btn-secondary { background: var(--primary-soft); color: var(--primary-ink); }
.btn-secondary:active { transform: scale(.97); }
.btn-ghost { color: var(--text-2); }
.btn-ghost:hover { background: var(--surface-2); }
.btn-ghost:active { transform: scale(.97); background: var(--surface-2); }
.btn-danger { color: var(--danger); }
.btn-danger:hover { background: var(--danger-soft); }
.btn-sm { min-height: var(--tap); padding: 0 var(--sp-4); font-size: var(--fs-label); line-height: var(--lh-label); }
.btn-block { width: 100%; }
.btn:disabled { background: var(--surface-2); color: var(--text-3); cursor: not-allowed; box-shadow: none; transform: none; }
.btn-icon { width: var(--tap); min-height: var(--tap); padding: 0; border-radius: var(--r-full); color: var(--text-2); }
.btn-icon:hover { background: var(--surface-2); }

/* --- Chip filtro --- */
.chips { display: flex; gap: var(--sp-2); overflow-x: auto; padding: 4px 0; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chips-wrap { flex-wrap: wrap; overflow: visible; row-gap: var(--sp-3); }
.chip { position: relative; flex: none; display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 14px; border-radius: var(--r-full); border: 1px solid var(--border); background: var(--surface); color: var(--text-2); font-size: var(--fs-label); line-height: var(--lh-label); font-weight: var(--fw-regular); transition: background-color var(--t-fast), color var(--t-fast), border-color var(--t-fast); -webkit-tap-highlight-color: transparent; }
.chip::before { content: ""; position: absolute; inset: -4px 0; } /* area di tocco a 44px */
.chip .ti { font-size: 16px; }
.chip .mono { font-size: var(--fs-caption); color: var(--text-3); }
.chip[aria-pressed="true"] { background: var(--text); border-color: var(--text); color: var(--bg); font-weight: var(--fw-strong); }
.chip[aria-pressed="true"] .mono { color: inherit; opacity: .75; }

/* --- Segmented control --- */
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; padding: 4px; border-radius: var(--r-md); background: var(--surface-2); }
.seg button { min-height: var(--tap); padding: 0 var(--sp-2); border: 0; border-radius: var(--r-sm); background: transparent; color: var(--text-2); font-size: var(--fs-label); line-height: var(--lh-label); font-weight: var(--fw-regular); transition: background-color var(--t-base) var(--ease-out), color var(--t-base); -webkit-tap-highlight-color: transparent; }
.seg button[aria-pressed="true"] { background: var(--surface-3); color: var(--text); font-weight: var(--fw-strong); box-shadow: var(--shadow-1); }

/* --- Checkbox con animazione di completamento --- */
.check { position: relative; flex: none; display: grid; place-items: center; width: var(--tap); height: var(--tap); cursor: pointer; -webkit-tap-highlight-color: transparent; }
.check input { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; opacity: 0; cursor: pointer; }
.check-box { position: relative; display: grid; place-items: center; width: 26px; height: 26px; border-radius: var(--r-full); border: 2px solid var(--border-strong); background: transparent; transition: background-color var(--t-base) var(--ease-out), border-color var(--t-base) var(--ease-out); }
.check-box svg { width: 16px; height: 16px; fill: none; stroke: var(--on-primary); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 22; stroke-dashoffset: 22; transition: stroke-dashoffset var(--t-base) var(--ease-out) 80ms; }
.check-box::after { content: ""; position: absolute; inset: -2px; border-radius: inherit; border: 2px solid var(--primary); opacity: 0; }
@media (hover: hover) { .check:hover .check-box { border-color: var(--primary); } }
.check input:focus-visible + .check-box { outline: 2px solid var(--ring); outline-offset: 3px; }
.check input:checked + .check-box { background: var(--primary); border-color: var(--primary); animation: check-pop var(--t-slow) var(--ease-pop); }
.check input:checked + .check-box svg { stroke-dashoffset: 0; }
.check input:checked + .check-box::after { animation: check-ring 480ms var(--ease-out); }
@keyframes check-pop { 0% { transform: scale(.8); } 60% { transform: scale(1.14); } 100% { transform: scale(1); } }
@keyframes check-ring { 0% { opacity: .7; transform: scale(1); } 100% { opacity: 0; transform: scale(2); } }

/* --- Gruppo e card ciclo --- */
.group { background: var(--surface); border-radius: var(--r-lg); box-shadow: var(--shadow-1); border: 1px solid var(--border); overflow: hidden; }
[data-theme="dark"] .group { box-shadow: none; }
.item + .item { border-top: 1px solid var(--border); }
.item-row { display: grid; grid-template-columns: var(--tap) minmax(0, 1fr) auto; align-items: center; column-gap: var(--sp-1); min-height: 64px; padding: var(--sp-2) var(--sp-3) var(--sp-2) var(--sp-2); }
.item-main { display: flex; flex-direction: column; justify-content: center; align-self: stretch; width: 100%; min-width: 0; min-height: var(--tap); padding: 2px 0; border: 0; background: none; text-align: left; -webkit-tap-highlight-color: transparent; }
.item-title { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; font-size: var(--fs-body); line-height: 22px; font-weight: var(--fw-regular); color: var(--text); transition: color var(--t-base); }
.item-meta { display: flex; align-items: center; gap: 6px; min-width: 0; font-size: var(--fs-caption); line-height: var(--lh-caption); color: var(--text-2); white-space: nowrap; overflow: hidden; }
.item-meta .sep { color: var(--border-strong); }
.item-side { display: flex; align-items: center; gap: 2px; color: var(--text-2); font-size: var(--fs-label); }
.item-side .ti { font-size: 18px; color: var(--text-3); transition: transform var(--t-base) var(--ease-out); }
.item:not(.is-open) .item-side .ti-chevron-down { display: none; }
.item.is-open .item-side .ti { transform: rotate(180deg); }
.item.is-done .item-title { color: var(--done-title); text-decoration: line-through; text-decoration-thickness: 1px; text-decoration-color: var(--border-strong); }
.item.is-done .tag { color: var(--done-meta); }
.item.is-done .item-meta, .item.is-done .item-side { color: var(--done-meta); opacity: var(--done-opacity); }
.item.is-late:not(.is-done) .item-side .mono { color: var(--q1); }

.tag { display: inline-flex; align-items: center; gap: 4px; font-weight: var(--fw-strong); white-space: nowrap; }
.tag .ti { font-size: 14px; }
.tag-q1 { color: var(--q1); } .tag-q2 { color: var(--q2); } .tag-q3 { color: var(--q3); } .tag-q4 { color: var(--q4); }

.item-detail { display: none; padding: 0 var(--sp-4) var(--sp-4) calc(var(--tap) + var(--sp-2) + var(--sp-1)); }
.item.is-open .item-detail { display: block; }
.item.is-open .item-title { -webkit-line-clamp: unset; font-weight: var(--fw-strong); }
.item-note { font-size: var(--fs-label); line-height: var(--lh-label); color: var(--text-2); margin-bottom: var(--sp-3); }
.facts { display: grid; gap: var(--sp-2); margin: 0 0 var(--sp-4); }
.fact { display: grid; grid-template-columns: 20px 1fr; gap: var(--sp-2); align-items: center; font-size: var(--fs-label); line-height: var(--lh-label); }
.fact .ti { font-size: 18px; color: var(--text-3); }
.item-actions { display: flex; flex-wrap: wrap; gap: var(--sp-2); align-items: center; }
.item-actions .btn-icon { margin-left: auto; }

/* densità desktop */
.dense .item-row { min-height: 44px; padding-top: 0; padding-bottom: 0; grid-template-columns: 44px minmax(0, 1fr) auto auto; column-gap: var(--sp-2); }
.dense .check { width: 44px; height: 44px; }
.dense .check-box { width: 20px; height: 20px; }
.dense .check-box svg { width: 12px; height: 12px; }
.dense .item-title { display: block; white-space: nowrap; text-overflow: ellipsis; font-size: var(--fs-label); line-height: var(--lh-label); }
.dense .item-meta { font-size: var(--fs-caption); }

/* --- Accordion --- */
.acc + .acc { border-top: 1px solid var(--border); }
.acc-head { display: grid; grid-template-columns: 24px 1fr auto; align-items: center; gap: var(--sp-2); width: 100%; min-height: 52px; padding: 0 var(--sp-4); border: 0; background: none; text-align: left; -webkit-tap-highlight-color: transparent; }
.acc-head .ti { color: var(--text-3); transition: transform var(--t-base) var(--ease-out); }
.acc-head[aria-expanded="true"] .ti { transform: rotate(90deg); }
.acc-title { font-weight: var(--fw-strong); }
.acc-title small { font-size: var(--fs-caption); font-weight: var(--fw-strong); color: var(--primary-ink); margin-left: var(--sp-2); }
.acc-count { display: flex; align-items: center; gap: var(--sp-2); font-size: var(--fs-label); color: var(--text-2); }
.acc-body { display: none; border-top: 1px solid var(--border); }
.acc-head[aria-expanded="true"] + .acc-body { display: block; }

/* --- Barra di avanzamento --- */
.bar { height: 8px; border-radius: var(--r-full); background: var(--surface-2); overflow: hidden; }
.bar > i { display: block; height: 100%; border-radius: inherit; background: var(--primary); transition: width var(--t-slow) var(--ease-out); }
.bar-sm { width: 40px; height: 6px; }

/* --- Toast --- */
.toast { display: flex; align-items: center; gap: var(--sp-2); min-height: 52px; padding: 4px 4px 4px var(--sp-3); border-radius: var(--r-md); background: var(--inverse-bg); color: var(--inverse-text); box-shadow: var(--shadow-2); font-size: var(--fs-label); line-height: var(--lh-label); }
[data-theme="dark"] .toast { box-shadow: 0 6px 16px rgba(0, 0, 0, .4); }
.toast .ti { flex: none; color: var(--inverse-accent); }
.toast-text { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.toast-action { flex: none; min-height: var(--tap); padding: 0 var(--sp-3); border: 0; border-radius: var(--r-sm); background: none; color: var(--inverse-accent); font-weight: var(--fw-strong); }
.toast-danger .ti:first-child { color: #F98B82; }
[data-theme="dark"] .toast-danger .ti:first-child { color: #B42318; }

/* --- Bottom nav --- */
.nav { display: grid; grid-template-columns: repeat(4, 1fr); height: calc(var(--nav-h) + env(safe-area-inset-bottom)); padding-bottom: env(safe-area-inset-bottom); background: var(--surface); border-top: 1px solid var(--border); }
.nav button { display: grid; justify-items: center; align-content: center; gap: 2px; min-height: var(--tap); border: 0; background: none; color: var(--text-2); font-size: var(--fs-caption); line-height: var(--lh-caption); font-weight: var(--fw-regular); -webkit-tap-highlight-color: transparent; }
.nav .nav-ico { display: grid; place-items: center; width: 56px; height: 28px; border-radius: var(--r-full); transition: background-color var(--t-base) var(--ease-out); }
.nav .ti { font-size: 22px; }
.nav button[aria-current="page"] { color: var(--primary-ink); font-weight: var(--fw-strong); }
.nav button[aria-current="page"] .nav-ico { background: var(--primary-soft); }

/* --- FAB --- */
.fab { display: grid; place-items: center; width: 56px; height: 56px; border: 0; border-radius: var(--r-lg); background: var(--primary); color: var(--on-primary); box-shadow: 0 3px 0 var(--primary-deep), var(--shadow-2); transition: transform var(--t-base) var(--ease-out); }
[data-theme="dark"] .fab { box-shadow: 0 3px 0 var(--primary-deep), 0 6px 16px rgba(0, 0, 0, .4); }
.fab:active { transform: translateY(3px); }
.fab .ti { font-size: 26px; }

/* --- Bottom sheet --- */
.sheet { background: var(--surface); border-radius: var(--r-xl) var(--r-xl) 0 0; box-shadow: var(--shadow-3); padding: var(--sp-2) var(--sp-4) calc(var(--sp-4) + env(safe-area-inset-bottom)); }
.sheet-grab { width: 36px; height: 4px; margin: 0 auto var(--sp-3); border-radius: var(--r-full); background: var(--border-strong); opacity: .6; }
.sheet-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: var(--sp-3); }
.field-label { display: block; font-size: var(--fs-label); line-height: var(--lh-label); font-weight: var(--fw-strong); margin: var(--sp-4) 0 var(--sp-2); }
.field-label small { font-size: var(--fs-caption); font-weight: var(--fw-regular); color: var(--text-3); margin-left: 6px; }
.input { width: 100%; min-height: 52px; padding: 0 var(--sp-4); border-radius: var(--r-md); border: 1.5px solid var(--border-strong); background: var(--surface); color: var(--text); font-size: var(--fs-body); }
.input::placeholder { color: var(--text-3); }
.input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-soft); }

/* --- Scelta del quadrante --- */
.quads { display: grid; grid-template-columns: 1fr 1fr; gap: var(--sp-2); }
.quad { display: grid; grid-template-columns: 32px minmax(0, 1fr); column-gap: var(--sp-2); align-items: center; min-height: 60px; padding: var(--sp-2) var(--sp-3) var(--sp-2) var(--sp-2); border-radius: var(--r-md); border: 1.5px solid var(--border); background: var(--surface); text-align: left; transition: border-color var(--t-fast), background-color var(--t-fast); -webkit-tap-highlight-color: transparent; }
.quad-ico { display: grid; place-items: center; width: 32px; height: 32px; border-radius: var(--r-sm); }
.quad b { display: block; font-size: var(--fs-label); line-height: var(--lh-label); font-weight: var(--fw-strong); color: var(--text); }
.quad small { display: block; font-size: var(--fs-caption); line-height: var(--lh-caption); color: var(--text-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.quad-1 .quad-ico { background: var(--q1-soft); color: var(--q1); }
.quad-2 .quad-ico { background: var(--q2-soft); color: var(--q2); }
.quad-3 .quad-ico { background: var(--q3-soft); color: var(--q3); }
.quad-4 .quad-ico { background: var(--q4-soft); color: var(--q4); }
.quad[aria-pressed="true"] { border-color: var(--text); background: var(--surface-2); }

/* --- Empty state --- */
.empty { display: grid; justify-items: center; gap: var(--sp-2); padding: var(--sp-6) var(--sp-5); text-align: center; }
.empty-ico { display: grid; place-items: center; width: 64px; height: 64px; margin-bottom: var(--sp-2); border-radius: var(--r-full); background: var(--primary-soft); color: var(--primary-ink); }
.empty-ico .ti { font-size: 30px; }
.empty p { font-size: var(--fs-label); line-height: var(--lh-label); color: var(--text-2); max-width: 30ch; }
.empty .btn { margin-top: var(--sp-3); }

/* --- Icone dei concetti --- */
.icons { display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--sp-2); }
.icon-cell { display: grid; justify-items: center; gap: 6px; padding: var(--sp-3) var(--sp-1); border-radius: var(--r-md); background: var(--surface); border: 1px solid var(--border); text-align: center; }
.icon-cell .ti { font-size: 24px; }
.icon-cell b { font-size: var(--fs-caption); line-height: var(--lh-caption); font-weight: var(--fw-strong); }
.icon-cell span { font-size: 11px; line-height: 14px; color: var(--text-3); overflow-wrap: anywhere; }

/* --- Cornici per i componenti a tutto schermo --- */
.phone { position: relative; height: 720px; border-radius: 28px; border: 1px solid var(--border); background: var(--bg); overflow: hidden; display: grid; grid-template-rows: 1fr auto; box-shadow: var(--shadow-2); }
.phone-scroll { overflow-y: auto; padding: var(--sp-5) var(--sp-4) 96px; scrollbar-width: none; }
.phone-scroll::-webkit-scrollbar { display: none; }
.phone .fab { position: absolute; right: var(--sp-4); bottom: calc(var(--nav-h) + var(--sp-4)); }
.phone .toast { position: absolute; left: var(--sp-4); right: var(--sp-4); bottom: calc(var(--nav-h) + var(--sp-3)); opacity: 0; transform: translateY(12px); pointer-events: none; transition: opacity var(--t-base) var(--ease-out), transform var(--t-base) var(--ease-out); }
.phone .toast.is-on { opacity: 1; transform: none; pointer-events: auto; }
/* il bottone + si alza per lasciare posto al toast */
.phone .toast.is-on + .fab { transform: translateY(-60px); }
.screen-head { margin-bottom: var(--sp-4); }
.progress { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: var(--sp-3); margin-bottom: var(--sp-5); }
.progress span { font-size: var(--fs-label); color: var(--text-2); }
.list-head { display: flex; align-items: baseline; justify-content: space-between; margin: var(--sp-5) var(--sp-1) var(--sp-2); font-size: var(--fs-label); line-height: var(--lh-label); font-weight: var(--fw-strong); color: var(--text-2); }
.list-head:first-of-type { margin-top: 0; }
.list-head .mono { font-weight: 500; color: var(--text-3); font-size: var(--fs-caption); }
.stage { position: relative; height: 600px; border-radius: 28px; border: 1px solid var(--border); background: var(--bg); overflow: hidden; }
.stage-back { padding: var(--sp-5) var(--sp-4); }
.stage::after { content: ""; position: absolute; inset: 0; background: var(--scrim); }
.stage .sheet { position: absolute; left: 0; right: 0; bottom: 0; z-index: 1; }
/* sotto i 900px le cornici vanno a tutta larghezza: lo schermo finto è largo quanto quello vero */
@media (max-width: 899px) {
  .phone, .stage { margin-inline: calc(-1 * var(--sp-4)); border-radius: 0; border-inline: 0; box-shadow: none; }
  .only-desktop { display: none; }
  .chips:not(.chips-wrap) { margin-inline: calc(-1 * var(--sp-4)); padding-inline: var(--sp-4); scroll-padding-inline: var(--sp-4); }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 1ms !important; transition-duration: 1ms !important; }
}
</style>
</head>

<script>
(function () {
  'use strict';
  var TOAST_MS = 4000;
  var THEME_META = { light: { label: 'Tema chiaro', icon: 'ti-sun' }, dark: { label: 'Tema scuro', icon: 'ti-moon' } };
  var tpl = document.getElementById('tpl');
  var grid = document.querySelector('.pv-grid');

  function rgbToHex(value) {
    var m = value.match(/\d+/g);
    if (!m || m.length < 3) return value.trim().toUpperCase();
    return '#' + m.slice(0, 3).map(function (n) { return Number(n).toString(16).padStart(2, '0'); }).join('').toUpperCase();
  }

  function mount(panel) {
    var theme = panel.dataset.theme;
    var inner = panel.querySelector('.theme-inner');
    inner.appendChild(tpl.content.cloneNode(true));
    inner.querySelector('[data-theme-label]').textContent = THEME_META[theme].label;
    inner.querySelector('[data-theme-ico]').classList.add(THEME_META[theme].icon);
    var styles = getComputedStyle(panel);
    inner.querySelectorAll('[data-token]').forEach(function (el) {
      var raw = styles.getPropertyValue(el.dataset.token).trim();
      el.textContent = raw.charAt(0) === '#' ? raw.toUpperCase() : rgbToHex(raw);
    });
  }

  function setPressed(group, target) {
    group.querySelectorAll('button').forEach(function (b) { b.setAttribute('aria-pressed', String(b === target)); });
  }

  function updateProgress(phone) {
    var boxes = phone.querySelectorAll('.phone-scroll input[type="checkbox"]');
    var done = Array.prototype.filter.call(boxes, function (b) { return b.checked; }).length;
    var bar = phone.querySelector('[role="progressbar"]');
    phone.querySelector('[data-progress-n]').textContent = String(done);
    bar.setAttribute('aria-valuenow', String(done));
    bar.firstElementChild.style.width = Math.round(done / boxes.length * 100) + '%';
  }

  function showToast(phone, input) {
    var toast = phone.querySelector('[data-live-toast]');
    var title = input.closest('.item').querySelector('.item-title').textContent;
    toast.querySelector('.toast-text').textContent = 'Fatta: ' + title;
    toast.classList.add('is-on');
    toast._input = input;
    clearTimeout(toast._timer);
    toast._timer = setTimeout(function () { toast.classList.remove('is-on'); }, TOAST_MS);
  }

  function onCheck(input) {
    var item = input.closest('.item');
    if (item) item.classList.toggle('is-done', input.checked);
    var phone = input.closest('.phone');
    if (!phone) return;
    updateProgress(phone);
    if (input.checked) showToast(phone, input);
  }

  document.querySelectorAll('.theme').forEach(mount);

  document.addEventListener('change', function (e) {
    if (e.target.matches('.check input')) onCheck(e.target);
  });

  document.addEventListener('click', function (e) {
    var btn = e.target.closest('button');
    if (!btn) return;

    var themeSeg = btn.closest('[data-pv-theme]');
    if (themeSeg) { setPressed(themeSeg, btn); grid.dataset.show = btn.dataset.value; window.scrollTo(0, 0); return; }

    var single = btn.closest('[data-seg], [data-chips], [data-quads]');
    if (single) { setPressed(single, btn); return; }

    if (btn.matches('.acc-head')) { btn.setAttribute('aria-expanded', String(btn.getAttribute('aria-expanded') !== 'true')); return; }

    if (btn.matches('.item-main')) {
      var item = btn.closest('.item');
      if (!item.querySelector('.item-detail')) return;
      btn.setAttribute('aria-expanded', String(item.classList.toggle('is-open')));
      return;
    }

    if (btn.matches('[data-undo]')) {
      var toast = btn.closest('.toast');
      if (toast._input) { toast._input.checked = false; onCheck(toast._input); }
      toast.classList.remove('is-on');
      return;
    }

    var nav = btn.closest('.nav');
    if (nav) nav.querySelectorAll('button').forEach(function (b) { if (b === btn) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current'); });
  });
})();
</script>
