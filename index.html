<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Cicli Aperti — Roby</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { -webkit-tap-highlight-color: transparent; }
    .done-anim { animation: slideOut 0.3s ease forwards; }
    @keyframes slideOut {
      to { opacity: 0; transform: translateX(60px); max-height: 0; padding: 0; margin: 0; }
    }
    .spin { animation: spin 0.6s linear; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen">

  <div class="max-w-xl mx-auto px-4 pb-28">

    <!-- Header -->
    <header class="sticky top-0 bg-gray-950/95 backdrop-blur pt-5 pb-3 z-10 border-b border-gray-800/60">
      <div class="flex items-center justify-between mb-3">
        <div>
          <h1 class="text-lg font-bold tracking-tight">Cicli Aperti</h1>
          <p id="week-label" class="text-xs text-gray-500 mt-0.5"></p>
        </div>
        <button id="btn-add"
          class="bg-blue-600 hover:bg-blue-500 active:bg-blue-700 text-white text-sm px-3.5 py-1.5 rounded-xl font-semibold transition-colors shadow">
          + Nuovo
        </button>
      </div>
      <!-- Context switcher -->
      <div class="flex gap-1.5">
        <button data-ctx="lavoro" class="ctx-btn flex-1 py-1.5 text-sm rounded-xl font-medium transition-colors">🏢 Lavoro</button>
        <button data-ctx="personale" class="ctx-btn flex-1 py-1.5 text-sm rounded-xl font-medium transition-colors">🏠 Personale</button>
      </div>
    </header>

    <!-- Stats bar -->
    <div id="stats-bar" class="flex gap-3 mt-4 mb-1 text-xs text-gray-500"></div>

    <!-- Cicli list -->
    <main id="cicli-list" class="mt-3 space-y-4"></main>

    <!-- Empty state -->
    <div id="empty-state" class="hidden text-center py-20 text-gray-600">
      <div class="text-5xl mb-3 opacity-50">✓</div>
      <div class="text-sm font-medium">Nessun ciclo aperto</div>
      <div class="text-xs mt-1">Ottimo lavoro!</div>
    </div>

    <!-- Loading -->
    <div id="loading" class="text-center py-20 text-gray-600 text-sm">Caricamento…</div>
  </div>

  <!-- FAB mobile -->
  <button id="btn-add-fab"
    class="fixed bottom-6 right-6 sm:hidden w-14 h-14 bg-blue-600 hover:bg-blue-500 active:bg-blue-700 rounded-full shadow-xl flex items-center justify-center text-2xl font-light transition-colors z-20">
    +
  </button>

  <!-- Modal add/edit -->
  <div id="modal" class="hidden fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-end sm:items-center justify-center p-0 sm:p-4">
    <div class="bg-gray-900 border border-gray-800 w-full max-w-lg rounded-t-2xl sm:rounded-2xl px-5 pt-5 pb-8 sm:pb-5 max-h-[92vh] overflow-y-auto shadow-2xl">

      <!-- drag handle -->
      <div class="sm:hidden w-10 h-1 bg-gray-700 rounded-full mx-auto mb-4"></div>

      <div class="flex items-center justify-between mb-4">
        <h2 id="modal-title" class="text-base font-bold">Nuovo Ciclo</h2>
        <button id="modal-close" class="text-gray-500 hover:text-gray-300 w-7 h-7 flex items-center justify-center rounded-lg hover:bg-gray-800 transition">✕</button>
      </div>

      <form id="ciclo-form" class="space-y-3.5">
        <input type="hidden" id="f-id">

        <!-- Titolo -->
        <div>
          <label class="text-xs text-gray-400 mb-1 block font-medium">Titolo *</label>
          <input id="f-title" type="text" autocomplete="off"
            class="w-full bg-gray-800 border border-gray-700 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500/30 placeholder-gray-600"
            placeholder="Cosa devi fare?">
        </div>

        <!-- Cat + Priorità -->
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="text-xs text-gray-400 mb-1 block font-medium">Categoria</label>
            <input id="f-cat" type="text" autocomplete="off" list="cat-suggestions"
              class="w-full bg-gray-800 border border-gray-700 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500/30 placeholder-gray-600"
              placeholder="vendite, casa…">
            <datalist id="cat-suggestions"></datalist>
          </div>
          <div>
            <label class="text-xs text-gray-400 mb-1 block font-medium">Priorità</label>
            <select id="f-q"
              class="w-full bg-gray-800 border border-gray-700 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500/30">
              <option value="1">🔴 Urgente</option>
              <option value="2" selected>🟡 Normale</option>
              <option value="3">🔵 Bassa</option>
              <option value="4">⚫ Un giorno</option>
            </select>
          </div>
        </div>

        <!-- Scadenza -->
        <div>
          <label class="text-xs text-gray-400 mb-1 block font-medium">Scadenza</label>
          <input id="f-due" type="date"
            class="w-full bg-gray-800 border border-gray-700 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500/30 text-gray-300">
        </div>

        <!-- Note -->
        <div>
          <label class="text-xs text-gray-400 mb-1 block font-medium">Note</label>
          <textarea id="f-note" rows="2"
            class="w-full bg-gray-800 border border-gray-700 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500/30 resize-none placeholder-gray-600"
            placeholder="Dettagli, contesto…"></textarea>
        </div>

        <!-- Ricorrenza -->
        <div class="bg-gray-800/50 border border-gray-700/60 rounded-xl p-3.5">
          <div class="flex items-center justify-between">
            <div>
              <span class="text-sm font-medium">🔄 Ricorrenza</span>
              <p class="text-xs text-gray-500 mt-0.5">Si ricrea al completamento</p>
            </div>
            <label class="relative inline-flex items-center cursor-pointer">
              <input type="checkbox" id="f-ricorrente" class="sr-only peer">
              <div class="w-10 h-6 bg-gray-700 rounded-full peer peer-checked:bg-blue-600 after:content-[''] after:absolute after:top-[3px] after:start-[3px] after:bg-white after:rounded-full after:h-[18px] after:w-[18px] after:transition-all peer-checked:after:translate-x-4"></div>
            </label>
          </div>
          <div id="ricorrenza-opts" class="hidden mt-3.5 grid grid-cols-2 gap-3">
            <div>
              <label class="text-xs text-gray-400 mb-1 block font-medium">Tipo</label>
              <select id="f-ric-tipo"
                class="w-full bg-gray-800 border border-gray-700 rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-blue-500">
                <option value="settimanale">Settimanale</option>
                <option value="mensile">Mensile (~4 sett.)</option>
              </select>
            </div>
            <div>
              <label class="text-xs text-gray-400 mb-1 block font-medium">Ogni</label>
              <select id="f-ric-ogni"
                class="w-full bg-gray-800 border border-gray-700 rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-blue-500">
                <option value="1">1</option>
                <option value="2">2</option>
                <option value="3">3</option>
                <option value="4">4</option>
                <option value="6">6</option>
              </select>
            </div>
          </div>
        </div>

        <!-- Actions -->
        <div class="flex gap-3 pt-1">
          <button type="button" id="modal-cancel"
            class="flex-1 bg-gray-800 hover:bg-gray-700 active:bg-gray-900 text-sm py-2.5 rounded-xl font-medium transition-colors">
            Annulla
          </button>
          <button type="submit" id="btn-save"
            class="flex-1 bg-blue-600 hover:bg-blue-500 active:bg-blue-700 text-sm py-2.5 rounded-xl font-semibold transition-colors">
            Salva
          </button>
        </div>
      </form>
    </div>
  </div>

  <script>
    const { createClient } = supabase;
    const db = createClient(
      'https://qujxbvootvollmziaqrd.supabase.co',
      'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InF1anhidm9vdHZvbGxtemlhcXJkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA4NzAyNjksImV4cCI6MjA5NjQ0NjI2OX0.WkUak4mQP-lwdaH-LIRV4unP6PljlcguiDXxjCkBEyE'
    );

    // ── State ──────────────────────────────────────────────────────
    let currentCtx = 'lavoro';
    let cicli = [];
    let allCats = [];
    let editingId = null;
    let saving = false;

    // ── Date utils ────────────────────────────────────────────────
    function getISOWeek(date) {
      const d = new Date(date);
      d.setHours(0, 0, 0, 0);
      d.setDate(d.getDate() + 4 - (d.getDay() || 7));
      const yearStart = new Date(d.getFullYear(), 0, 1);
      return {
        week: Math.ceil((((d - yearStart) / 86400000) + 1) / 7),
        year: d.getFullYear(),
      };
    }

    function weeksInYear(y) {
      return getISOWeek(new Date(y, 11, 28)).week;
    }

    function addWeeks(week, year, n) {
      let w = week + n;
      let y = year;
      const max = weeksInYear(y);
      if (w > max) { w -= max; y += 1; }
      return { week: w, year: y };
    }

    function nextPeriod(ciclo) {
      const w = ciclo.week || today.week;
      const y = ciclo.year || today.year;
      const ogni = ciclo.ricorrenza_ogni || 1;
      if (ciclo.ricorrenza_tipo === 'mensile') return addWeeks(w, y, ogni * 4);
      return addWeeks(w, y, ogni);
    }

    function fmtDate(iso) {
      if (!iso) return '';
      return new Date(iso + 'T12:00:00').toLocaleDateString('it-IT', { day: 'numeric', month: 'short' });
    }

    function isOverdue(iso) {
      if (!iso) return false;
      return new Date(iso + 'T23:59:59') < new Date();
    }

    const today = getISOWeek(new Date());

    // ── Priority config ──────────────────────────────────────────
    const PRIO = {
      1: { label: 'Urgente',  dot: 'bg-red-500',    border: 'border-l-red-500',    badge: 'bg-red-900/40 text-red-300' },
      2: { label: 'Normale',  dot: 'bg-yellow-400',  border: 'border-l-yellow-500', badge: 'bg-yellow-900/30 text-yellow-300' },
      3: { label: 'Bassa',    dot: 'bg-blue-500',    border: 'border-l-blue-500',   badge: 'bg-blue-900/30 text-blue-300' },
      4: { label: 'Un giorno',dot: 'bg-gray-600',    border: 'border-l-gray-600',   badge: 'bg-gray-800 text-gray-400' },
    };

    // ── Load ──────────────────────────────────────────────────────
    async function loadCicli() {
      document.getElementById('loading').classList.remove('hidden');
      document.getElementById('cicli-list').innerHTML = '';
      document.getElementById('empty-state').classList.add('hidden');

      const { data, error } = await db
        .from('cicli')
        .select('*')
        .eq('ctx', currentCtx)
        .eq('done', false)
        .order('q', { ascending: true })
        .order('created_at', { ascending: true });

      document.getElementById('loading').classList.add('hidden');
      if (error) { console.error(error); return; }

      cicli = data || [];

      // Build cat suggestions from all existing cats
      allCats = [...new Set(cicli.map(c => c.cat).filter(Boolean))];
      const ds = document.getElementById('cat-suggestions');
      ds.innerHTML = allCats.map(c => `<option value="${c}">`).join('');

      render();
    }

    // ── Mark done ─────────────────────────────────────────────────
    async function markDone(id) {
      const ciclo = cicli.find(c => c.id === id);
      if (!ciclo) return;

      // Animate
      const el = document.querySelector(`[data-id="${id}"]`);
      if (el) el.classList.add('done-anim');

      // DB: mark done
      await db.from('cicli').update({ done: true, updated_at: new Date().toISOString() }).eq('id', id);

      // Se ricorrente → crea il prossimo
      if (ciclo.ricorrente) {
        const next = nextPeriod(ciclo);
        await db.from('cicli').insert({
          title: ciclo.title,
          cat: ciclo.cat,
          note: ciclo.note,
          q: ciclo.q,
          ctx: ciclo.ctx,
          week: next.week,
          year: next.year,
          ricorrente: true,
          ricorrenza_tipo: ciclo.ricorrenza_tipo,
          ricorrenza_ogni: ciclo.ricorrenza_ogni,
          done: false,
          da_plaud: false,
          persone_menzionate: ciclo.persone_menzionate || [],
        });
      }

      setTimeout(() => loadCicli(), 300);
    }

    // ── Delete ────────────────────────────────────────────────────
    async function deleteCiclo(id) {
      if (!confirm('Eliminare questo ciclo?')) return;
      await db.from('cicli').delete().eq('id', id);
      loadCicli();
    }

    // ── Save ──────────────────────────────────────────────────────
    async function saveCiclo(payload) {
      if (editingId) {
        await db.from('cicli')
          .update({ ...payload, updated_at: new Date().toISOString() })
          .eq('id', editingId);
      } else {
        await db.from('cicli').insert({
          ...payload,
          ctx: currentCtx,
          week: today.week,
          year: today.year,
          done: false,
          da_plaud: false,
          persone_menzionate: [],
        });
      }
      closeModal();
      loadCicli();
    }

    // ── Render ────────────────────────────────────────────────────
    function render() {
      // Week label
      document.getElementById('week-label').textContent =
        `Settimana ${today.week} · ${today.year}`;

      // Ctx buttons
      document.querySelectorAll('.ctx-btn').forEach(btn => {
        const active = btn.dataset.ctx === currentCtx;
        btn.className = `ctx-btn flex-1 py-1.5 text-sm rounded-xl font-medium transition-colors ${
          active
            ? 'bg-blue-600 text-white shadow'
            : 'bg-gray-800 text-gray-400 hover:bg-gray-700'
        }`;
      });

      const list = document.getElementById('cicli-list');
      const empty = document.getElementById('empty-state');

      if (cicli.length === 0) {
        list.innerHTML = '';
        empty.classList.remove('hidden');
        renderStats();
        return;
      }
      empty.classList.add('hidden');

      // Group by category, sort cats by min q
      const grouped = {};
      cicli.forEach(c => {
        const cat = c.cat || '—';
        if (!grouped[cat]) grouped[cat] = [];
        grouped[cat].push(c);
      });

      const sortedCats = Object.keys(grouped).sort((a, b) => {
        const minA = Math.min(...grouped[a].map(c => c.q));
        const minB = Math.min(...grouped[b].map(c => c.q));
        return minA - minB;
      });

      list.innerHTML = sortedCats.map(cat => `
        <div>
          <div class="flex items-center gap-2 mb-2">
            <span class="text-xs uppercase tracking-widest text-gray-500 font-semibold">${cat}</span>
            <span class="text-xs text-gray-700">${grouped[cat].length}</span>
          </div>
          <div class="space-y-1.5">
            ${grouped[cat].map(renderCiclo).join('')}
          </div>
        </div>
      `).join('');

      renderStats();
    }

    function renderCiclo(c) {
      const p = PRIO[c.q] || PRIO[2];
      const overdue = isOverdue(c.due_date);
      const dueStr = fmtDate(c.due_date);
      const ricLabel = c.ricorrente
        ? `ogni ${c.ricorrenza_ogni} ${c.ricorrenza_tipo === 'mensile' ? 'mesi' : c.ricorrenza_ogni === 1 ? 'sett.' : 'settimane'}`
        : '';

      return `
        <div data-id="${c.id}"
          class="group bg-gray-900 border border-gray-800 hover:border-gray-700 rounded-xl border-l-4 ${p.border} px-3 py-2.5 flex items-start gap-3 transition-colors">

          <!-- Done button -->
          <button onclick="markDone('${c.id}')"
            class="flex-shrink-0 mt-0.5 w-5 h-5 rounded-full border-2 border-gray-600 hover:border-green-400 hover:bg-green-500/10 transition-colors flex items-center justify-center text-xs">
            <span class="hidden group-hover:block text-green-400 leading-none">✓</span>
          </button>

          <!-- Content -->
          <div class="flex-1 min-w-0">
            <div class="flex items-center gap-1.5 flex-wrap">
              <span class="text-sm font-medium leading-snug">${escHtml(c.title)}</span>
              ${c.ricorrente ? `<span class="text-xs text-blue-400 bg-blue-900/30 px-1.5 py-0.5 rounded-md font-medium" title="${ricLabel}">🔄 ${ricLabel}</span>` : ''}
            </div>
            <div class="flex items-center gap-2.5 mt-1 flex-wrap">
              ${dueStr ? `<span class="text-xs ${overdue ? 'text-red-400 font-medium' : 'text-gray-500'}">${overdue ? '⚠️ ' : '📅 '}${dueStr}</span>` : ''}
              ${c.persone_menzionate && c.persone_menzionate.length
                ? `<span class="text-xs text-gray-600">👤 ${c.persone_menzionate.join(', ')}</span>`
                : ''}
              ${c.note ? `<span class="text-xs text-gray-600 truncate max-w-[180px]">${escHtml(c.note.substring(0, 40))}${c.note.length > 40 ? '…' : ''}</span>` : ''}
            </div>
          </div>

          <!-- Actions (visible on hover) -->
          <div class="flex items-center gap-0.5 opacity-0 group-hover:opacity-100 transition-opacity flex-shrink-0 mt-0.5">
            <button onclick="openEdit('${c.id}')"
              class="text-gray-600 hover:text-blue-400 w-7 h-7 flex items-center justify-center rounded-lg hover:bg-gray-800 transition text-sm">
              ✏️
            </button>
            <button onclick="deleteCiclo('${c.id}')"
              class="text-gray-600 hover:text-red-400 w-7 h-7 flex items-center justify-center rounded-lg hover:bg-gray-800 transition text-sm">
              🗑️
            </button>
          </div>
        </div>
      `;
    }

    function renderStats() {
      const bar = document.getElementById('stats-bar');
      if (cicli.length === 0) { bar.innerHTML = ''; return; }

      const urgenti = cicli.filter(c => c.q === 1).length;
      const ricorrenti = cicli.filter(c => c.ricorrente).length;
      const scaduti = cicli.filter(c => isOverdue(c.due_date)).length;

      bar.innerHTML = [
        cicli.length ? `<span>${cicli.length} aperti</span>` : '',
        urgenti ? `<span class="text-red-400">🔴 ${urgenti} urgenti</span>` : '',
        ricorrenti ? `<span class="text-blue-400">🔄 ${ricorrenti} ricorrenti</span>` : '',
        scaduti ? `<span class="text-orange-400">⚠️ ${scaduti} scaduti</span>` : '',
      ].filter(Boolean).join('<span class="text-gray-700">·</span>');
    }

    // ── Modal ─────────────────────────────────────────────────────
    function openAdd() {
      editingId = null;
      document.getElementById('modal-title').textContent = 'Nuovo Ciclo';
      document.getElementById('ciclo-form').reset();
      document.getElementById('f-id').value = '';
      document.getElementById('f-q').value = '2';
      document.getElementById('ricorrenza-opts').classList.add('hidden');
      showModal();
      setTimeout(() => document.getElementById('f-title').focus(), 100);
    }

    function openEdit(id) {
      const c = cicli.find(x => x.id === id);
      if (!c) return;
      editingId = id;
      document.getElementById('modal-title').textContent = 'Modifica Ciclo';
      document.getElementById('f-id').value = id;
      document.getElementById('f-title').value = c.title || '';
      document.getElementById('f-cat').value = c.cat || '';
      document.getElementById('f-q').value = c.q || 2;
      document.getElementById('f-due').value = c.due_date || '';
      document.getElementById('f-note').value = c.note || '';
      document.getElementById('f-ricorrente').checked = !!c.ricorrente;
      document.getElementById('f-ric-tipo').value = c.ricorrenza_tipo || 'settimanale';
      document.getElementById('f-ric-ogni').value = c.ricorrenza_ogni || 1;
      document.getElementById('ricorrenza-opts').classList.toggle('hidden', !c.ricorrente);
      showModal();
    }

    function showModal() {
      document.getElementById('modal').classList.remove('hidden');
    }

    function closeModal() {
      document.getElementById('modal').classList.add('hidden');
      editingId = null;
    }

    // ── Escape HTML ───────────────────────────────────────────────
    function escHtml(str) {
      return (str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    // ── Events ────────────────────────────────────────────────────
    document.getElementById('btn-add').addEventListener('click', openAdd);
    document.getElementById('btn-add-fab').addEventListener('click', openAdd);
    document.getElementById('modal-close').addEventListener('click', closeModal);
    document.getElementById('modal-cancel').addEventListener('click', closeModal);
    document.getElementById('modal').addEventListener('click', e => {
      if (e.target === document.getElementById('modal')) closeModal();
    });

    document.querySelectorAll('.ctx-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        currentCtx = btn.dataset.ctx;
        loadCicli();
      });
    });

    document.getElementById('f-ricorrente').addEventListener('change', e => {
      document.getElementById('ricorrenza-opts').classList.toggle('hidden', !e.target.checked);
    });

    document.getElementById('ciclo-form').addEventListener('submit', async e => {
      e.preventDefault();
      if (saving) return;
      const title = document.getElementById('f-title').value.trim();
      if (!title) {
        document.getElementById('f-title').focus();
        return;
      }
      saving = true;
      const btn = document.getElementById('btn-save');
      btn.textContent = '…';
      btn.disabled = true;

      const ricorrente = document.getElementById('f-ricorrente').checked;

      await saveCiclo({
        title,
        cat: document.getElementById('f-cat').value.trim() || null,
        q: parseInt(document.getElementById('f-q').value),
        due_date: document.getElementById('f-due').value || null,
        note: document.getElementById('f-note').value.trim() || null,
        ricorrente,
        ricorrenza_tipo: ricorrente ? document.getElementById('f-ric-tipo').value : null,
        ricorrenza_ogni: ricorrente ? parseInt(document.getElementById('f-ric-ogni').value) : null,
      });

      saving = false;
      btn.textContent = 'Salva';
      btn.disabled = false;
    });

    // ── Init ──────────────────────────────────────────────────────
    loadCicli();
  </script>
</body>
</html>
