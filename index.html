<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Cicli Aperti</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --bg:#0a0b0d;--bg2:#111316;--bg3:#181b1f;--bg4:#1e2227;
  --line:#232830;--line2:#2d3340;--muted:#5a6272;--sub:#8a94a6;
  --text:#dce3ed;--white:#f0f4fa;
  --lav:#4f8eff;--lav2:rgba(79,142,255,.13);
  --per:#a259ff;--per2:rgba(162,89,255,.13);
  --q1c:#ff4d4d;--q1b:rgba(255,77,77,.1);
  --q2c:#4f8eff;--q2b:rgba(79,142,255,.1);
  --q3c:#ffaa00;--q3b:rgba(255,170,0,.1);
  --q4c:#3d4555;--q4b:rgba(61,69,85,.15);
  --green:#34d058;--orange:#ff8c00;--red:#ff4d4d;
  --acc:var(--lav);--acc2:var(--lav2);
  --hh:56px;--sw:220px;--r:10px;--r2:14px;
  --shadow:0 4px 24px rgba(0,0,0,.4);
}
body.light{
  --bg:#f5f6f8;--bg2:#fff;--bg3:#eef0f4;--bg4:#e4e7ed;
  --line:#e2e6ed;--line2:#cdd3dc;--muted:#6b7280;
  --sub:#4b5563;--text:#1a1d23;--white:#0a0b0d;
}
body.ctx-per{--acc:var(--per);--acc2:var(--per2);}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{height:100%;}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);
  height:100vh;overflow:hidden;font-size:14px;-webkit-tap-highlight-color:transparent;}
button{font-family:'Inter',sans-serif;cursor:pointer;}
input,textarea,select{font-family:'Inter',sans-serif;}
::-webkit-scrollbar{width:4px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--line2);border-radius:2px;}

/* ── HEADER ── */
.app-header{position:fixed;top:0;left:0;right:0;height:var(--hh);
  background:rgba(10,11,13,.88);backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line);display:flex;align-items:center;
  gap:8px;padding:0 14px;z-index:100;}
body.light .app-header{background:rgba(245,246,248,.92);}
.logo{font-family:'Syne',sans-serif;font-weight:800;font-size:15px;
  letter-spacing:-.3px;white-space:nowrap;color:var(--text);flex-shrink:0;}
.logo span{color:var(--acc);}

.week-nav{display:flex;align-items:center;gap:1px;background:var(--bg3);
  border:1px solid var(--line);border-radius:20px;padding:2px 3px;
  font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--sub);white-space:nowrap;}
.week-nav.dim{opacity:.5;}
.wn-btn{background:none;border:none;color:var(--muted);padding:3px 6px;
  border-radius:12px;font-size:12px;line-height:1;transition:background .15s;}
.wn-btn:hover{background:var(--line);color:var(--text);}
#week-lbl{padding:0 3px;}

.ctx-toggle{display:flex;background:var(--bg3);border:1px solid var(--line);
  border-radius:20px;padding:2px;gap:2px;flex-shrink:0;}
.ctx-btn{border:none;background:none;color:var(--muted);padding:3px 10px;
  border-radius:16px;font-size:12px;font-weight:500;transition:all .15s;white-space:nowrap;}
.ctx-btn.active{background:var(--acc);color:#fff;}

.search-wrap{flex:1;max-width:220px;position:relative;}
.search-inp{width:100%;background:var(--bg3);border:1px solid var(--line);
  border-radius:20px;padding:5px 26px;font-size:12px;color:var(--text);outline:none;transition:border .15s;}
.search-inp::placeholder{color:var(--muted);}
.search-inp:focus{border-color:var(--acc);}
.si{position:absolute;left:9px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:11px;pointer-events:none;}
.sc{position:absolute;right:8px;top:50%;transform:translateY(-50%);background:none;border:none;
  color:var(--muted);font-size:12px;display:none;}
.sc.v{display:block;}

.h-actions{display:flex;align-items:center;gap:4px;margin-left:auto;}
.icon-btn{background:none;border:1px solid var(--line);color:var(--sub);width:32px;height:32px;
  border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:14px;transition:all .15s;}
.icon-btn:hover{background:var(--bg3);color:var(--text);border-color:var(--line2);}
.btn-new{background:var(--acc);color:#fff;border:none;border-radius:8px;padding:6px 12px;
  font-size:12px;font-weight:600;white-space:nowrap;transition:opacity .15s;}
.btn-new:hover{opacity:.85;}

/* ── LAYOUT ── */
.app-body{display:flex;height:calc(100vh - var(--hh));margin-top:var(--hh);overflow:hidden;}

/* ── SIDEBAR ── */
.sidebar{width:var(--sw);flex-shrink:0;overflow-y:auto;
  border-right:1px solid var(--line);padding:12px 0;background:var(--bg2);}
.sb-sec-title{font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;
  color:var(--muted);padding:8px 14px 3px;}
.nav-item{display:flex;align-items:center;gap:7px;padding:7px 14px;color:var(--sub);
  font-size:13px;font-weight:500;border:none;background:none;width:100%;
  text-align:left;transition:all .12s;position:relative;}
.nav-item:hover{background:var(--bg3);color:var(--text);}
.nav-item.active{background:var(--lav2);color:var(--lav);}
body.ctx-per .nav-item.active{background:var(--per2);color:var(--per);}
.nb{margin-left:auto;background:var(--bg4);color:var(--muted);font-size:10px;
  padding:1px 6px;border-radius:8px;font-family:'JetBrains Mono',monospace;}
.nav-item.active .nb{background:var(--acc);color:#fff;}
.ni{color:var(--muted);font-size:11px;margin-left:auto;padding:1px 3px;}
.ni:hover{color:var(--sub);}
.sb-div{border:none;border-top:1px solid var(--line);margin:6px 0;}
.cat-row{display:flex;align-items:center;gap:6px;padding:5px 14px;
  font-size:12px;color:var(--sub);cursor:pointer;transition:all .12s;}
.cat-row:hover{background:var(--bg3);color:var(--text);}
.cat-row.active{color:var(--acc);}
.cat-cnt{margin-left:auto;color:var(--muted);font-size:10px;font-family:'JetBrains Mono',monospace;}
.btn-addcat{display:flex;align-items:center;gap:5px;padding:6px 14px;color:var(--muted);
  font-size:12px;background:none;border:none;width:100%;text-align:left;transition:color .12s;}
.btn-addcat:hover{color:var(--acc);}

/* ── MAIN ── */
.main-content{flex:1;overflow-y:auto;padding:18px 22px;background:var(--bg);}
.view{display:none;}.view.active{display:block;}
.view-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
.view-head h2{font-family:'Syne',sans-serif;font-size:18px;font-weight:700;}

/* ── SUMMARY BAR ── */
.sum-bar{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px;}
.sum-card{background:var(--bg2);border:1px solid var(--line);border-radius:var(--r);
  padding:10px 12px;cursor:pointer;transition:border-color .15s;}
.sum-card:hover{border-color:var(--line2);}
.sum-lbl{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;margin-bottom:3px;}
.sum-n{font-family:'Syne',sans-serif;font-size:22px;font-weight:700;line-height:1;}
.sq1 .sum-lbl,.sq1 .sum-n{color:var(--q1c);}
.sq2 .sum-lbl,.sq2 .sum-n{color:var(--q2c);}
.sq3 .sum-lbl,.sq3 .sum-n{color:var(--q3c);}
.sq4 .sum-lbl{color:var(--muted);}.sq4 .sum-n{color:var(--sub);}

/* ── NOTICE ── */
.notice-bar{display:flex;flex-direction:column;gap:4px;margin-bottom:12px;}
.notice{display:flex;align-items:center;gap:8px;padding:7px 12px;border-radius:8px;font-size:12px;font-weight:500;}
.notice.crit{background:rgba(255,77,77,.1);border:1px solid rgba(255,77,77,.2);color:var(--q1c);}
.notice.warn{background:rgba(255,138,0,.1);border:1px solid rgba(255,138,0,.2);color:var(--orange);}

/* ── MATRIX ── */
.mat-axes{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
.ax{font-family:'Syne',sans-serif;font-size:10px;font-weight:700;letter-spacing:.08em;
  text-transform:uppercase;color:var(--muted);}
.ax-line{flex:1;height:1px;background:var(--line);}
.matrix-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.quadrant{background:var(--bg2);border:1px solid var(--line);border-radius:var(--r2);overflow:hidden;min-height:100px;}
.q-hd{border-top:2px solid;padding:9px 12px 7px;display:flex;align-items:center;gap:5px;}
.q-icon{font-size:13px;}
.q-title{font-family:'Syne',sans-serif;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;}
.q-cnt{margin-left:auto;font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--muted);}
.qQ1 .q-hd{border-color:var(--q1c);}.qQ1 .q-title{color:var(--q1c);}
.qQ2 .q-hd{border-color:var(--q2c);}.qQ2 .q-title{color:var(--q2c);}
.qQ3 .q-hd{border-color:var(--q3c);}.qQ3 .q-title{color:var(--q3c);}
.qQ4 .q-hd{border-color:var(--q4c);}.qQ4 .q-title{color:var(--muted);}
.q-cards{padding:0 8px 8px;display:flex;flex-direction:column;gap:4px;}
.btn-addq{display:flex;align-items:center;gap:4px;padding:5px 4px;color:var(--muted);font-size:11px;
  background:none;border:none;width:100%;transition:color .12s;margin-top:2px;}
.btn-addq:hover{color:var(--acc);}

/* ── CICLO CARD ── */
.ciclo-card{background:var(--bg3);border:1px solid var(--line);border-radius:8px;
  padding:8px 10px;cursor:pointer;transition:transform .15s,box-shadow .15s,border-color .15s;}
.ciclo-card:hover{transform:translateY(-1px);box-shadow:0 4px 16px rgba(0,0,0,.22);border-color:var(--line2);}
.ciclo-card.crit{border-left:2px solid var(--q1c);}
.ciclo-card.warn{border-left:2px solid var(--orange);}
.card-top{display:flex;align-items:flex-start;gap:7px;}
.chk{flex-shrink:0;width:16px;height:16px;border:1.5px solid var(--muted);border-radius:50%;
  background:none;display:flex;align-items:center;justify-content:center;margin-top:1px;
  transition:all .15s;font-size:9px;color:transparent;}
.chk:hover{border-color:var(--green);background:rgba(52,208,88,.15);color:var(--green);}
.chk.doing{border-color:var(--green);background:var(--green);color:#fff;}
.card-title{font-size:12px;font-weight:500;line-height:1.4;flex:1;color:var(--text);}
.card-ft{display:flex;align-items:center;gap:4px;flex-wrap:wrap;margin-top:6px;}
.cat-pill{background:var(--bg4);color:var(--sub);font-size:10px;padding:1px 6px;border-radius:6px;font-weight:500;}
.due-ok{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--green);background:rgba(52,208,88,.1);padding:1px 5px;border-radius:4px;}
.due-warn{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--orange);background:rgba(255,138,0,.1);padding:1px 5px;border-radius:4px;}
.due-crit{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--q1c);background:var(--q1b);padding:1px 5px;border-radius:4px;}
.esc-w{font-size:9px;padding:1px 4px;border-radius:4px;font-weight:600;background:rgba(255,138,0,.15);color:var(--orange);}
.esc-c{font-size:9px;padding:1px 4px;border-radius:4px;font-weight:600;background:var(--q1b);color:var(--q1c);}
.ric-ic{font-size:11px;}
.avatars{display:flex;}
.av{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--bg3);display:flex;align-items:center;
  justify-content:center;font-size:8px;font-weight:700;color:#fff;margin-left:-5px;}
.avatars .av:first-child{margin-left:0;}
.av-more{background:var(--bg4);color:var(--muted);font-size:7px;}
@keyframes doneOut{0%{opacity:1;transform:scale(1);}70%{opacity:.4;transform:scale(.95);}100%{opacity:0;max-height:0;padding:0;margin:0;border:none;}}
.done-anim{animation:doneOut .35s ease forwards;}

/* ── LISTA ── */
.lista-row{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--bg2);
  border:1px solid var(--line);border-radius:var(--r);margin-bottom:5px;cursor:pointer;transition:border-color .15s,transform .1s;}
.lista-row:hover{border-color:var(--line2);transform:translateX(2px);}
.lista-row.crit{border-left:2px solid var(--q1c);}
.lista-row.warn{border-left:2px solid var(--orange);}
.q-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.qd1{background:var(--q1c);}.qd2{background:var(--q2c);}.qd3{background:var(--q3c);}.qd4{background:var(--q4c);}
.lr-title{flex:1;font-size:13px;font-weight:500;}
.lr-meta{display:flex;align-items:center;gap:8px;flex-shrink:0;}

/* ── PERSONE ── */
.persone-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px;}
.pcard{background:var(--bg2);border:1px solid var(--line);border-radius:var(--r2);padding:16px;
  cursor:pointer;transition:border-color .15s,transform .1s;}
.pcard:hover{border-color:var(--line2);transform:translateY(-2px);}
.pav-lg{width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:18px;font-weight:700;font-family:'Syne',sans-serif;color:#fff;margin-bottom:10px;flex-shrink:0;}
.p-nome{font-size:14px;font-weight:600;margin-bottom:2px;}
.p-ruolo{font-size:11px;color:var(--muted);margin-bottom:6px;}
.p-cnt{font-size:11px;color:var(--sub);font-family:'JetBrains Mono',monospace;}

/* ── STORICO ── */
.sto-row{display:flex;align-items:flex-start;gap:10px;padding:10px 12px;background:var(--bg2);
  border:1px solid var(--line);border-radius:var(--r);margin-bottom:5px;}
.sto-title{font-size:13px;font-weight:500;flex:1;}
.sto-meta{font-size:11px;color:var(--muted);font-family:'JetBrains Mono',monospace;}

/* ── GUIDA ── */
details.gd{background:var(--bg2);border:1px solid var(--line);border-radius:var(--r);margin-bottom:6px;overflow:hidden;}
details.gd summary{padding:12px 16px;cursor:pointer;font-weight:500;font-size:14px;list-style:none;
  display:flex;align-items:center;justify-content:space-between;}
details.gd summary::-webkit-details-marker{display:none;}
details.gd summary .arr{font-size:10px;color:var(--muted);transition:transform .2s;}
details.gd[open] summary .arr{transform:rotate(90deg);}
.gd-body{padding:0 16px 16px;color:var(--sub);font-size:13px;line-height:1.65;}
.gd-body p{margin-bottom:8px;}.gd-body ul{padding-left:18px;}
.gd-body li{margin-bottom:4px;}
.gd-body code{font-family:'JetBrains Mono',monospace;font-size:11px;background:var(--bg3);padding:1px 5px;border-radius:3px;color:var(--text);}
.gd-body strong{color:var(--text);font-weight:600;}
.kbd{display:inline-block;background:var(--bg4);border:1px solid var(--line2);border-radius:4px;
  font-family:'JetBrains Mono',monospace;font-size:11px;padding:1px 6px;color:var(--text);}

/* ── EMPTY / SKELETON ── */
.empty{text-align:center;padding:36px 20px;color:var(--muted);}
.empty .ei{font-size:32px;margin-bottom:8px;opacity:.45;}
.empty .et{font-size:13px;}
.skel{background:linear-gradient(90deg,var(--bg2) 25%,var(--bg3) 50%,var(--bg2) 75%);
  background-size:200% 100%;animation:shim 1.5s infinite;border-radius:var(--r);}
@keyframes shim{0%{background-position:200% 0;}100%{background-position:-200% 0;}}

/* ── MODAL ── */
.m-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(4px);
  z-index:200;display:flex;align-items:flex-end;justify-content:center;}
@media(min-width:768px){.m-overlay{align-items:center;}}
.modal{background:var(--bg2);border:1px solid var(--line2);border-radius:var(--r2) var(--r2) 0 0;
  width:100%;max-width:540px;max-height:92vh;overflow-y:auto;}
@media(min-width:768px){.modal{border-radius:var(--r2);}}
.m-drag{width:34px;height:3px;background:var(--line2);border-radius:2px;margin:10px auto 0;}
@media(min-width:768px){.m-drag{display:none;}}
.m-hd{padding:14px 18px;display:flex;align-items:center;justify-content:space-between;
  border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg2);z-index:1;}
.m-title{font-family:'Syne',sans-serif;font-size:15px;font-weight:700;}
.m-x{width:28px;height:28px;background:var(--bg3);border:none;border-radius:7px;color:var(--sub);
  display:flex;align-items:center;justify-content:center;font-size:13px;transition:all .15s;}
.m-x:hover{background:var(--bg4);color:var(--text);}
.m-body{padding:16px 18px;}
.m-ft{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:7px;flex-wrap:wrap;}
.btn{padding:8px 14px;border-radius:8px;font-size:13px;font-weight:500;border:1px solid var(--line);transition:all .15s;}
.btn-ghost{background:var(--bg3);color:var(--sub);}
.btn-ghost:hover{background:var(--bg4);color:var(--text);}
.btn-primary{background:var(--acc);color:#fff;border-color:var(--acc);flex:1;font-weight:600;}
.btn-primary:hover{opacity:.85;}
.btn-success{background:rgba(52,208,88,.12);color:var(--green);border-color:rgba(52,208,88,.25);}
.btn-success:hover{background:rgba(52,208,88,.2);}
.btn-danger{background:rgba(255,77,77,.1);color:var(--red);border-color:rgba(255,77,77,.2);}
.btn-danger:hover{background:rgba(255,77,77,.18);}
.btn-sm{padding:5px 10px;font-size:12px;border-radius:6px;}

/* ── FORM ── */
.fr{margin-bottom:13px;}
.fl{font-size:11px;font-weight:500;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px;display:block;}
.fi,.fs,.fta{width:100%;background:var(--bg3);border:1px solid var(--line);border-radius:8px;
  padding:8px 10px;font-size:13px;color:var(--text);outline:none;transition:border .15s;}
.fi:focus,.fs:focus,.fta:focus{border-color:var(--acc);}
.fta{resize:vertical;min-height:56px;}
.fs option{background:var(--bg2);}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.days-hint{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--sub);margin-top:3px;}

.ctx-tog-m{display:flex;gap:5px;margin-bottom:14px;}
.ctx-tog-m .cb{flex:1;padding:7px;border-radius:8px;border:1.5px solid var(--line);
  font-size:13px;background:var(--bg3);color:var(--sub);transition:all .15s;}
.ctx-tog-m .cb.al{border-color:var(--lav);background:var(--lav2);color:var(--lav);}
.ctx-tog-m .cb.ap{border-color:var(--per);background:var(--per2);color:var(--per);}

/* Q PICKER */
.qpick{display:grid;grid-template-columns:1fr 1fr;gap:6px;}
.qpb{display:flex;align-items:center;gap:6px;padding:8px 10px;border:1.5px solid var(--line);
  border-radius:8px;background:var(--bg3);font-size:12px;font-weight:500;color:var(--sub);transition:all .15s;}
.qpb:hover{border-color:var(--line2);color:var(--text);}
.qpb.sq1{border-color:var(--q1c);background:var(--q1b);color:var(--q1c);}
.qpb.sq2{border-color:var(--q2c);background:var(--q2b);color:var(--q2c);}
.qpb.sq3{border-color:var(--q3c);background:var(--q3b);color:var(--q3c);}
.qpb.sq4{border-color:var(--q4c);background:var(--q4b);color:var(--sub);}

/* PERSON PICKER */
.pp-wrap{position:relative;}
.pp-chips{display:flex;flex-wrap:wrap;gap:4px;min-height:36px;padding:6px 8px;
  background:var(--bg3);border:1px solid var(--line);border-radius:8px;align-items:center;cursor:text;transition:border .15s;}
.pp-chips:focus-within{border-color:var(--acc);}
.pchip{display:flex;align-items:center;gap:3px;padding:2px 8px 2px 4px;border-radius:20px;font-size:11px;font-weight:500;color:#fff;}
.pchip-av{width:16px;height:16px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:8px;font-weight:700;}
.pchip-x{background:none;border:none;color:rgba(255,255,255,.6);font-size:10px;padding:0 0 0 1px;line-height:1;}
.pchip-x:hover{color:#fff;}

<script>
// ═══════════════════════════════════════════════════
// SUPABASE
// ═══════════════════════════════════════════════════
const { createClient } = supabase;
const db = createClient(
  'https://qujxbvootvollmziaqrd.supabase.co',
  'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InF1anhidm9vdHZvbGxtemlhcXJkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA4NzAyNjksImV4cCI6MjA5NjQ0NjI2OX0.WkUak4mQP-lwdaH-LIRV4unP6PljlcguiDXxjCkBEyE'
);

// ═══════════════════════════════════════════════════
// UTILS
// ═══════════════════════════════════════════════════
function ls(k, v) {
  if (v !== undefined) { localStorage.setItem(k, String(v)); return v; }
  return localStorage.getItem(k);
}

function getISOWeek(d) {
  const dt = new Date(d);
  dt.setHours(0,0,0,0);
  dt.setDate(dt.getDate() + 4 - (dt.getDay() || 7));
  const y1 = new Date(dt.getFullYear(), 0, 1);
  return { week: Math.ceil((((dt - y1) / 86400000) + 1) / 7), year: dt.getFullYear() };
}

function getWeekBounds(week, year) {
  const jan4 = new Date(year, 0, 4);
  const dow = jan4.getDay() || 7;
  const mon = new Date(jan4);
  mon.setDate(jan4.getDate() - dow + 1 + (week - 1) * 7);
  const sun = new Date(mon);
  sun.setDate(mon.getDate() + 6);
  return { start: mon, end: sun };
}

function weeksInYear(y) { return getISOWeek(new Date(y, 11, 28)).week; }

function fmtWeekNav(w, y) {
  const { start, end } = getWeekBounds(w, y);
  const f = d => `${d.getDate()}/${d.getMonth()+1}`;
  return `Sett.${w} · ${f(start)}–${f(end)}`;
}

function daysLeft(due) {
  if (!due) return 999;
  return Math.ceil((new Date(due + 'T23:59:59') - new Date()) / 86400000);
}

function effQ(c) {
  const dl = daysLeft(c.due_date);
  if (c.q === 2 && dl <= 30 && dl >= 0) return 1;
  if (c.q === 4 && dl <= 14 && dl >= 0) return 3;
  return c.q;
}

function escCls(c) {
  if (!c.due_date) return '';
  const dl = daysLeft(c.due_date);
  if (dl <= 14) return 'crit';
  if (dl <= 30) return 'warn';
  return '';
}

function dueBadge(due) {
  if (!due) return '';
  const dl = daysLeft(due);
  if (dl < 0) return `<span class="due-crit">${Math.abs(dl)}gg fa</span>`;
  if (dl === 0) return `<span class="due-crit">oggi</span>`;
  if (dl <= 14) return `<span class="due-crit">${dl}gg</span>`;
  if (dl <= 30) return `<span class="due-warn">${dl}gg</span>`;
  return `<span class="due-ok">${dl}gg</span>`;
}

function fmtDate(iso) {
  if (!iso) return '';
  return new Date(iso + 'T12:00:00').toLocaleDateString('it-IT', { day:'numeric', month:'short' });
}

function fmtTs(iso) {
  if (!iso) return '';
  return new Date(iso).toLocaleDateString('it-IT', { day:'numeric', month:'short', hour:'2-digit', minute:'2-digit' });
}

function H(s) {
  return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function pColor(p) { return p?.colore || '#4f8eff'; }
function pInit(n) { return (n||'?').charAt(0).toUpperCase(); }
function pById(id) { return S.persone.find(p => p.id === id); }

function calcNextDue(due, ric) {
  const d = new Date((due || new Date().toISOString().split('T')[0]) + 'T12:00:00');
  if (ric === 'settimanale') d.setDate(d.getDate() + 7);
  else if (ric === 'mensile') d.setMonth(d.getMonth() + 1);
  else if (ric === 'trimestrale') d.setMonth(d.getMonth() + 3);
  else if (ric === 'annuale') d.setFullYear(d.getFullYear() + 1);
  else return null;
  return d.toISOString().split('T')[0];
}

function cicloPersoneResolved(cicloId) {
  const ids = S.cpMap[cicloId] || [];
  if (ids.length) return ids.map(id => pById(id)).filter(Boolean);
  const c = S.cicli.find(x => x.id === cicloId);
  return (c?.persone_menzionate || [])
    .map(nome => S.persone.find(p => p.nome.toLowerCase() === nome.toLowerCase()))
    .filter(Boolean);
}

function renderAvatars(persons, max = 3) {
  if (!persons?.length) return '';
  const show = persons.slice(0, max);
  const extra = persons.length - max;
  return `<div class="avatars">
    ${show.map(p => `<div class="av" style="background:${pColor(p)}" title="${H(p.nome)}">${pInit(p.nome)}</div>`).join('')}
    ${extra > 0 ? `<div class="av av-more">+${extra}</div>` : ''}
  </div>`;
}

// ═══════════════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════════════
const TD = getISOWeek(new Date());
const S = {
  ctx: ls('cicli_ctx') || 'lavoro',
  view: ls('cicli_view') || 'matrice',
  week: parseInt(ls('cicli_week')) || TD.week,
  year: parseInt(ls('cicli_year')) || TD.year,
  catFilter: ls('cicli_cat_filter') || null,
  onlyRic: false,
  search: '',
  cicli: [],
  persone: [],
  categorie: [],
  cpMap: {},     // ciclo_id → [persona_id]
  nlMap: {},     // ciclo_id → [note]
};

// Apply saved theme
if (ls('cicli_theme') === 'light') document.body.classList.add('light');
document.body.classList.toggle('ctx-per', S.ctx === 'personale');

// ═══════════════════════════════════════════════════
// DATA
// ═══════════════════════════════════════════════════
async function loadAll() {
  await Promise.all([loadCicli(), loadPersone(), loadCategorie()]);
  await loadCicloPersone();
  render();
  checkEscalation();
}

async function loadCicli() {
  const { data } = await db.from('cicli').select('*').order('created_at', { ascending: false });
  S.cicli = data || [];
}

async function loadPersone() {
  const { data } = await db.from('persone').select('*').order('nome');
  S.persone = data || [];
}

async function loadCategorie() {
  const { data } = await db.from('categorie').select('*').order('ordine').order('nome');
  S.categorie = data || [];
}

async function loadCicloPersone() {
  const ids = S.cicli.map(c => c.id);
  if (!ids.length) { S.cpMap = {}; return; }
  const { data } = await db.from('ciclo_persone').select('ciclo_id,persona_id').in('ciclo_id', ids);
  S.cpMap = {};
  (data || []).forEach(r => {
    if (!S.cpMap[r.ciclo_id]) S.cpMap[r.ciclo_id] = [];
    S.cpMap[r.ciclo_id].push(r.persona_id);
  });
}

async function loadNoteForCiclo(id) {
  if (S.nlMap[id]) return S.nlMap[id];
  const { data } = await db.from('note_log').select('*').eq('ciclo_id', id).order('created_at');
  S.nlMap[id] = data || [];
  return S.nlMap[id];
}

function checkEscalation() {
  const open = S.cicli.filter(c => !c.done && c.ctx === S.ctx);
  const auto = open.filter(c => effQ(c) !== c.q);
  if (auto.length) toast(`⚡ ${auto.length} cicl${auto.length>1?'i':'o'} auto-escalat${auto.length>1?'i':'o'} per scadenza`, 'w');
}

// ═══════════════════════════════════════════════════
// ACTIONS
// ═══════════════════════════════════════════════════
async function saveCiclo(payload, id) {
  if (id) {
    await db.from('cicli').update({ ...payload, updated_at: new Date().toISOString() }).eq('id', id);
  } else {
    const { data } = await db.from('cicli').insert({ ...payload, done: false, da_plaud: false,
      persone_menzionate: [] }).select().single();
    id = data?.id;
  }
  return id;
}

async function saveCicloPersone(cicloId, personaIds) {
  await db.from('ciclo_persone').delete().eq('ciclo_id', cicloId);
  if (personaIds.length) {
    await db.from('ciclo_persone').insert(personaIds.map(pid => ({ ciclo_id: cicloId, persona_id: pid })));
  }
  S.cpMap[cicloId] = personaIds;
  // Update persone_menzionate[]
  const nomi = personaIds.map(pid => pById(pid)?.nome).filter(Boolean);
  await db.from('cicli').update({ persone_menzionate: nomi }).eq('id', cicloId);
}

async function closeCicloById(id) {
  const c = S.cicli.find(x => x.id === id);
  if (!c) return;
  await db.from('cicli').update({ done: true, chiuso_at: new Date().toISOString(), updated_at: new Date().toISOString() }).eq('id', id);
  let msg = 'Ciclo chiuso ✓';
  if (c.ricorrenza && c.ricorrenza !== 'nessuna') {
    const nextDue = calcNextDue(c.due_date, c.ricorrenza);
    const { data: newC } = await db.from('cicli').insert({
      title: c.title, cat: c.cat, note: c.note, q: c.q, ctx: c.ctx,
      week: TD.week, year: TD.year, due_date: nextDue,
      ricorrenza: c.ricorrenza, ricorrenza_parent_id: id,
      done: false, da_plaud: false, persone_menzionate: c.persone_menzionate || [],
    }).select().single();
    if (newC) {
      const pids = S.cpMap[id] || [];
      if (pids.length) await db.from('ciclo_persone').insert(pids.map(pid => ({ ciclo_id: newC.id, persona_id: pid })));
      S.cpMap[newC.id] = pids;
    }
    msg = `Ciclo chiuso ✓ — ricreato per ${nextDue ? fmtDate(nextDue) : 'prossimo periodo'}`;
  }
  toast(msg, 's');
  await loadCicli();
  await loadCicloPersone();
  render();
}

async function deleteCicloById(id) {
  await db.from('cicli').delete().eq('id', id);
  toast('Ciclo eliminato', 'w');
  await loadCicli();
  await loadCicloPersone();
  render();
}

async function riapriciCiclo(id) {
  await db.from('cicli').update({ done: false, chiuso_at: null, updated_at: new Date().toISOString() }).eq('id', id);
  toast('Ciclo riaperto', 's');
  await loadCicli();
  render();
}

// ═══════════════════════════════════════════════════
// NAV / CONTEXT / WEEK
// ═══════════════════════════════════════════════════
function setCtx(ctx) {
  S.ctx = ctx; S.catFilter = null; S.onlyRic = false;
  ls('cicli_ctx', ctx); ls('cicli_cat_filter', '');
  document.body.classList.toggle('ctx-per', ctx === 'personale');
  document.getElementById('cb-lav').classList.toggle('active', ctx === 'lavoro');
  document.getElementById('cb-per').classList.toggle('active', ctx === 'personale');
  render();
}

function setView(v) {
  S.view = v; ls('cicli_view', v);
  document.querySelectorAll('.view').forEach(el => el.classList.remove('active'));
  document.getElementById('view-' + v)?.classList.add('active');
  document.querySelectorAll('.nav-item[id^=nav-]').forEach(el => el.classList.remove('active'));
  document.getElementById('nav-' + v)?.classList.add('active');
  document.querySelectorAll('.bnb').forEach(el => el.classList.remove('active'));
  document.getElementById('bnb-' + v)?.classList.add('active');
  const wn = document.getElementById('week-nav');
  wn.classList.toggle('dim', v !== 'lista');
  renderView();
}

function shiftWeek(d) {
  S.week += d;
  if (S.week < 1) { S.year--; S.week = weeksInYear(S.year); }
  if (S.week > weeksInYear(S.year)) { S.week = 1; S.year++; }
  ls('cicli_week', S.week); ls('cicli_year', S.year);
  document.getElementById('week-lbl').textContent = fmtWeekNav(S.week, S.year);
  if (S.view === 'lista') renderView();
}

function onSearch(v) {
  S.search = v;
  document.getElementById('sc-btn').classList.toggle('v', !!v);
  renderView();
}

function clearSearch() {
  S.search = '';
  document.getElementById('search-inp').value = '';
  document.getElementById('sc-btn').classList.remove('v');
  renderView();
}

function filterRicorrenti() {
  S.onlyRic = !S.onlyRic;
  setView('matrice');
}

// ═══════════════════════════════════════════════════
// RENDER
// ═══════════════════════════════════════════════════
function render() {
  document.getElementById('week-lbl').textContent = fmtWeekNav(S.week, S.year);
  renderSidebar();
  renderView();
  // Update badges
  const open = S.cicli.filter(c => c.done && c.ctx === S.ctx);
  document.getElementById('nb-done').textContent = S.cicli.filter(c => c.done && c.ctx === S.ctx).length;
  document.getElementById('nb-ric').textContent = S.cicli.filter(c => !c.done && c.ctx === S.ctx && c.ricorrenza && c.ricorrenza !== 'nessuna').length;
}

function renderSidebar() {
  const cats = getCatsForCtx();
  document.getElementById('sb-cats').innerHTML = cats.map(cat => {
    const cnt = S.cicli.filter(c => !c.done && c.ctx === S.ctx && c.cat === cat.nome).length;
    return `<div class="cat-row ${S.catFilter === cat.nome ? 'active' : ''}" onclick="setCatFilter('${H(cat.nome)}')">
      <span>${cat.emoji || '📋'}</span>
      <span>${H(cat.nome)}</span>
      <span class="cat-cnt">${cnt}</span>
    </div>`;
  }).join('') + (S.catFilter ? `<div class="cat-row" onclick="setCatFilter(null)" style="color:var(--muted);font-size:11px;padding-left:22px">✕ rimuovi filtro</div>` : '');
}

function getCatsForCtx() {
  const fromCicli = [...new Set(S.cicli.filter(c => c.ctx === S.ctx && !c.done && c.cat).map(c => c.cat))];
  const fromCat = S.categorie.filter(c => c.ctx === S.ctx).map(c => c.nome);
  const all = [...new Set([...fromCat, ...fromCicli])];
  return all.map(nome => {
    const saved = S.categorie.find(c => c.nome === nome && c.ctx === S.ctx);
    return { nome, emoji: saved?.emoji || '📋' };
  });
}

function setCatFilter(cat) {
  S.catFilter = cat === S.catFilter ? null : cat;
  ls('cicli_cat_filter', S.catFilter || '');
  renderSidebar();
  renderView();
}

function renderView() {
  const v = S.view;
  if (v === 'matrice') renderMatrice();
  else if (v === 'lista') renderLista();
  else if (v === 'persone') renderPersone();
  else if (v === 'storico') renderStorico();
  else if (v === 'guida') renderGuida();
}

// ─── MATRICE ────────────────────────────────────────
function getFilteredOpen() {
  return S.cicli.filter(c =>
    !c.done &&
    c.ctx === S.ctx &&
    (!S.catFilter || c.cat === S.catFilter) &&
    (!S.onlyRic || (c.ricorrenza && c.ricorrenza !== 'nessuna')) &&
    (!S.search || c.title.toLowerCase().includes(S.search.toLowerCase()))
  );
}

function renderMatrice() {
  const el = document.getElementById('view-matrice');
  const cicli = getFilteredOpen();
  const byQ = { 1:[], 2:[], 3:[], 4:[] };
  cicli.forEach(c => { const q = effQ(c); (byQ[q] = byQ[q]||[]).push(c); });
  [1,2,3,4].forEach(q => byQ[q].sort((a,b) => {
    if (!a.due_date && !b.due_date) return 0;
    if (!a.due_date) return 1; if (!b.due_date) return -1;
    return new Date(a.due_date) - new Date(b.due_date);
  }));
  const crit = cicli.filter(c => escCls(c) === 'crit');
  const warn = cicli.filter(c => escCls(c) === 'warn');
  const QI = {
    1:{icon:'🔥',label:'Crisi'},2:{icon:'📌',label:'Qualità'},
    3:{icon:'📋',label:'Inganno'},4:{icon:'🗑️',label:'Spreco'}
  };
  el.innerHTML = `
    <div class="sum-bar">
      ${[1,2,3,4].map(q=>`
        <div class="sum-card sq${q}" onclick="setCatFilter(null)">
          <div class="sum-lbl">Q${q} ${QI[q].label}</div>
          <div class="sum-n">${byQ[q].length}</div>
        </div>`).join('')}
    </div>
    ${(crit.length||warn.length)?`<div class="notice-bar">
      ${crit.length?`<div class="notice crit">⚡ ${crit.length} cicl${crit.length>1?'i':'o'} in scadenza critica (≤14gg)</div>`:''}
      ${warn.length?`<div class="notice warn">⚠️ ${warn.length} cicl${warn.length>1?'i':'o'} con scadenza entro 30gg</div>`:''}
    </div>`:''}
    <div class="mat-axes">
      <span class="ax">⚡ Urgente</span>
      <div class="ax-line"></div>
      <span class="ax">— Non urgente</span>
    </div>
    <div class="matrix-grid">
      ${[1,2,3,4].map(q=>`
        <div class="quadrant qQ${q}">
          <div class="q-hd">
            <span class="q-icon">${QI[q].icon}</span>
            <span class="q-title">Q${q} ${QI[q].label}</span>
            <span class="q-cnt">${byQ[q].length}</span>
          </div>
          <div class="q-cards">
            ${byQ[q].map(c=>renderCard(c)).join('')}
            ${byQ[q].length===0?`<div class="empty" style="padding:14px 8px"><div class="et" style="font-size:11px">—</div></div>`:''}
            <button class="btn-addq" onclick="openModalNew(${q})">+ Aggiungi</button>
          </div>
        </div>`).join('')}
    </div>
  `;
}

function renderCard(c) {
  const esc = escCls(c);
  const persons = cicloPersoneResolved(c.id);
  const isRic = c.ricorrenza && c.ricorrenza !== 'nessuna';
  return `
    <div class="ciclo-card ${esc}" data-id="${c.id}" onclick="openModalEdit('${c.id}')">
      <div class="card-top">
        <button class="chk" id="chk-${c.id}" onclick="event.stopPropagation();doClose('${c.id}',this)" title="Chiudi">✓</button>
        <span class="card-title">${H(c.title)}</span>
      </div>
      <div class="card-ft">
        ${c.cat?`<span class="cat-pill">${H(c.cat)}</span>`:''}
        ${renderAvatars(persons)}
        ${dueBadge(c.due_date)}
        ${esc==='crit'?`<span class="esc-c">⚡</span>`:esc==='warn'?`<span class="esc-w">⚠</span>`:''}
        ${isRic?`<span class="ric-ic" title="${c.ricorrenza}">🔄</span>`:''}
      </div>
    </div>`;
}

// ─── LISTA ──────────────────────────────────────────
function renderLista() {
  const el = document.getElementById('view-lista');
  const cicli = S.cicli.filter(c =>

function openModalNew(q = 2) {
  mId = null; mCtx = S.ctx; mQ = q; mPersone = []; mNoteLog = [];
  document.getElementById('mc-title').textContent = 'Nuovo Ciclo';
  document.getElementById('mc-del').style.display = 'none';

  const c = S.cicli.find(x => x.id === id);

  mId = id; mCtx = c.ctx; mQ = c.q;
  mPersone = cicloPersoneResolved(id).map(p=>({id:p.id,nome:p.nome,colore:p.colore||'#4f8eff'}));

  document.getElementById('mc-title').textContent = 'Modifica Ciclo';

      <label class="fl">Note progressive</label>
      <div class="nl-list" id="nl-list">${renderNoteItems()}</div>
      <div class="nl-add">
        <input class="fi" id="nl-inp" type="text" placeholder="Aggiungi nota…"
          onkeydown="if(event.key==='Enter'){event.preventDefault();addNota();}">
        <button class="btn-nota" onclick="addNota()">Aggiungi</button>
      </div>
    </div>
  `;
  if (c?.due_date) updateDaysHint();
}

function setMCtx(ctx) {
  mCtx = ctx;
  document.getElementById('mcb-lav').classList.toggle('al', ctx==='lavoro');
  document.getElementById('mcb-per').classList.toggle('ap', ctx==='personale');
}

function setMQ(q) {
  mQ = q;
  document.querySelectorAll('.qpb').forEach((b,i)=>{
    b.className='qpb'+(mQ===i+1?' sq'+(i+1):'');
  });
}

function updateDaysHint() {
  const due = document.getElementById('mf-due')?.value;
  const el = document.getElementById('dh');
  if (!el) return;
  if (!due) { el.textContent=''; return; }
  const dl = daysLeft(due);
  el.textContent = dl < 0 ? `${Math.abs(dl)}gg fa` : dl === 0 ? 'Oggi!' : `${dl} giorni rimanenti`;
  el.style.color = dl <= 14 ? 'var(--q1c)' : dl <= 30 ? 'var(--orange)' : 'var(--sub)';
}

function toggleRicInfo() {
  const v = document.getElementById('mf-ric')?.value;
  const el = document.getElementById('ric-inf');
  if (el) el.style.display = v && v !== 'nessuna' ? 'block' : 'none';
}

// Person picker
function renderChips() {
  return mPersone.map((p,i)=>`
    <span class="pchip" style="background:${p.colore||'#4f8eff'}">
      <span class="pchip-av">${pInit(p.nome)}</span>
      ${H(p.nome)}
      <button class="pchip-x" onclick="removeChip(${i})">✕</button>
    </span>`).join('');
}

function removeChip(i) {
  mPersone.splice(i,1);
  document.getElementById('chips-inner').innerHTML = renderChips();
}

function searchPersoneDD(q) {
  const dd = document.getElementById('pp-dd');
  if (!q.trim()) { dd.style.display='none'; return; }
  const matches = S.persone.filter(p =>
    p.nome.toLowerCase().includes(q.toLowerCase()) &&
    !mPersone.find(mp => mp.id === p.id)
  );
  if (!matches.length && !q.trim()) { dd.style.display='none'; return; }
  dd.innerHTML = matches.map(p=>`
    <div class="pp-opt" onclick="addChip('${p.id}')">
      <div class="pp-opt-av" style="background:${pColor(p)}">${pInit(p.nome)}</div>
      ${H(p.nome)} ${p.ruolo?`<span style="color:var(--muted);font-size:11px">${H(p.ruolo)}</span>`:''}
    </div>`).join('') +
    `<div class="pp-new" onclick="createPersonaInline('${H(q)}')">+ Crea "${H(q)}"</div>`;
  dd.style.display = 'block';
}

function addChip(pid) {
  const p = pById(pid);
  if (!p || mPersone.find(x=>x.id===pid)) return;
  mPersone.push({id:p.id, nome:p.nome, colore:p.colore||'#4f8eff'});
  document.getElementById('chips-inner').innerHTML = renderChips();
  const inp = document.getElementById('pp-inp');
  inp.value=''; inp.placeholder='';
  document.getElementById('pp-dd').style.display='none';
}

function ppKeydown(e) {
  if (e.key === 'Backspace' && !e.target.value && mPersone.length) {
    mPersone.pop();
    document.getElementById('chips-inner').innerHTML = renderChips();
  }
}

async function createPersonaInline(nome) {
  const { data } = await db.from('persone').insert({ nome, contesto: mCtx, colore: '#4f8eff' }).select().single();
  if (data) {
    S.persone.push(data);
    addChip(data.id);
  }
  document.getElementById('pp-dd').style.display='none';
}

// Note log
function renderNoteItems() {
  if (!mNoteLog.length) return `<div style="color:var(--muted);font-size:12px;padding:4px 0">Nessuna nota ancora</div>`;
  return mNoteLog.map(n=>`
    <div class="nl-item">
      <div class="nl-txt">${H(n.testo)}</div>
      <div class="nl-ts">${fmtTs(n.created_at)}</div>
    </div>`).join('');
}

function renderNoteLog() {
  const el = document.getElementById('nl-list');
  if (el) el.innerHTML = renderNoteItems();
}

async function addNota() {
  const inp = document.getElementById('nl-inp');
  if (!inp) return;
  const testo = inp.value.trim();
  if (!testo) return;
  if (mId) {
    const { data } = await db.from('note_log').insert({ ciclo_id: mId, testo }).select().single();
    if (data) { mNoteLog.push(data); S.nlMap[mId] = mNoteLog; renderNoteLog(); }
  } else {
    mNoteLog.push({ testo, created_at: new Date().toISOString(), temp: true });
    renderNoteLog();
  }
  inp.value = '';
}

// Submit
async function submitCiclo() {
  if (mSaving) return;
  const title = document.getElementById('mf-title')?.value.trim();
  if (!title) { toast('Titolo obbligatorio', 'e'); return; }
  mSaving = true;
  const btn = document.querySelector('#mo-ciclo .btn-primary');
  if (btn) { btn.textContent = '…'; btn.disabled = true; }

  const payload = {
    title,
    cat: document.getElementById('mf-cat')?.value.trim() || null,
    q: mQ,
    ctx: mCtx,
    week: parseInt(document.getElementById('mf-week')?.value) || S.week,
    year: S.year,
    due_date: document.getElementById('mf-due')?.value || null,
    ricorrenza: document.getElementById('mf-ric')?.value || 'nessuna',
  };

  const id = await saveCiclo(payload, mId);
  // Save note log if new + temp notes
  if (!mId) {
    for (const n of mNoteLog.filter(x=>x.temp)) {
      await db.from('note_log').insert({ ciclo_id: id, testo: n.testo });
    }
  }
  await saveCicloPersone(id, mPersone.map(p=>p.id));
  closeModal('ciclo');
  await loadCicli();
  await loadCicloPersone();
  render();
  toast(mId ? 'Ciclo aggiornato' : 'Ciclo creato ✓', 's');
  mSaving = false;
}

async function closeCurrent() {
  if (!mId) return;
  closeModal('ciclo');
  const el = document.querySelector(`[data-id="${mId}"]`);
  if (el) el.classList.add('done-anim');
  await closeCicloById(mId);
}

async function deleteCurrent() {
  if (!mId || !confirm('Eliminare questo ciclo?')) return;
  closeModal('ciclo');
  await deleteCicloById(mId);
}

async function doClose(id, btn) {
  btn.classList.add('doing');
  const el = btn.closest('[data-id]');
  if (el) setTimeout(()=>el.classList.add('done-anim'), 100);
  await closeCicloById(id);
}

function closeModal(which) {
  document.getElementById('mo-' + which).setAttribute('hidden','');
  mSaving = false;
}

// ═══════════════════════════════════════════════════
// PLAUD IMPORT
// ═══════════════════════════════════════════════════
let plaudStep = 1;
let plaudCicli = [];

function openPlaud() {
  plaudStep = 1; plaudCicli = [];
  renderPlaud();
  document.getElementById('mo-plaud').removeAttribute('hidden');
}

function renderPlaud() {
  const body = document.getElementById('mp-body');
  const ft = document.getElementById('mp-ft');
  const steps = ['Incolla testo','Anteprima','Salva'];

  body.innerHTML = `<div class="plaud-steps">${steps.map((s,i)=>`<div class="ps ${plaudStep===i+1?'active':''}">${i+1}. ${s}</div>`).join('')}</div>`;

  if (plaudStep === 1) {
    body.innerHTML += `<div class="fr"><label class="fl">Testo da Plaud (trascrizione)</label>
      <textarea class="fta" id="plaud-txt" rows="8" placeholder="Incolla qui la trascrizione…"></textarea></div>`;
    ft.innerHTML = `<button class="btn btn-ghost btn-sm" onclick="closeModal('plaud')">Annulla</button>
      <button class="btn btn-primary btn-sm" onclick="runPlaud()">Estrai con Claude →</button>`;
  } else if (plaudStep === 2) {
    const preview = plaudCicli.map((c,i)=>`
      <div class="pp-card">
        <div class="pp-card-title">${H(c.titolo)}</div>
        <div class="pp-card-meta">
          Q${c.quadrante||2} · ${H(c.contesto||'lavoro')} · ${c.scadenza_suggerita||'nessuna scadenza'}
          ${c.persone?.length?` · 👤 ${c.persone.join(', ')}`:''}<br>
          ${c.note?`💬 ${H(c.note)}`:''}
        </div>
      </div>`).join('');
    body.innerHTML += `<div class="plaud-preview">${preview}</div>`;
    ft.innerHTML = `<button class="btn btn-ghost btn-sm" onclick="plaudStep=1;renderPlaud()">← Indietro</button>
      <span style="flex:1;text-align:center;font-size:12px;color:var(--muted)">${plaudCicli.length} cicli estratti</span>
      <button class="btn btn-primary btn-sm" onclick="savePlaud()">Salva tutti →</button>`;
  } else {
    body.innerHTML += `<div class="empty"><div class="ei">✅</div><div class="et">Importazione completata!</div></div>`;
    ft.innerHTML = `<button class="btn btn-primary btn-sm" onclick="closeModal('plaud')">Chiudi</button>`;
  }
}

async function runPlaud() {
  const txt = document.getElementById('plaud-txt')?.value.trim();
  if (!txt) { toast('Incolla prima il testo', 'w'); return; }
  const apiKey = ls('cicli_claude_key');
  if (!apiKey) { toast('Configura la chiave Claude API nelle Impostazioni ⚙️', 'w'); return; }
  const btn = document.querySelector('#mp-ft .btn-primary');
  if (btn) { btn.textContent = 'Elaborazione…'; btn.disabled = true; }
  try {
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method:'POST',
      headers:{'Content-Type':'application/json','x-api-key':apiKey,'anthropic-version':'2023-06-01'},
      body:JSON.stringify({
        model:'claude-sonnet-4-6', max_tokens:2048,
        messages:[{role:'user',content:`Estrai da questo testo registrato i cicli aperti (azioni, compiti, follow-up).
Rispondi SOLO con un JSON array puro, senza markdown, con questi campi:
[{"titolo":"...","contesto":"lavoro|personale","quadrante":1-4,"note":"...","persone":["nome1"],"scadenza_suggerita":"YYYY-MM-DD o null"}]

Testo:\n${txt}`}]
      })
    });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    const raw = data.content[0].text;
    const match = raw.match(/\[[\s\S]*\]/);
    if (!match) throw new Error('Risposta non valida');
    plaudCicli = JSON.parse(match[0]);
    plaudStep = 2;
  } catch(e) {
    toast('Errore Claude: ' + e.message, 'e');
    if (btn) { btn.textContent = 'Estrai con Claude →'; btn.disabled = false; }
    return;
  }
  renderPlaud();
}

async function savePlaud() {
  let saved = 0;
  for (const c of plaudCicli) {
    try {
      await db.from('cicli').insert({
        title: c.titolo, ctx: c.contesto||'lavoro', q: c.quadrante||2,
        due_date: c.scadenza_suggerita||null, note: c.note||null,
        week: TD.week, year: TD.year, done: false, da_plaud: true,
        ricorrenza: 'nessuna', persone_menzionate: c.persone||[],
      });
      saved++;
    } catch(e) { console.error(e); }
  }
  plaudStep = 3;
  renderPlaud();
  toast(`${saved} cicli importati da Plaud ✓`, 's');
  await loadCicli();
  await loadCicloPersone();
  render();
}

    <div class="st-tabs">
      <button class="st-tab ${stTab==='api'?'active':''}" onclick="stTab='api';renderSettings()">API Claude</button>
      <button class="st-tab ${stTab==='cat'?'active':''}" onclick="stTab='cat';renderSettings()">Categorie</button>
      <button class="st-tab ${stTab==='per'?'active':''}" onclick="stTab='per';renderSettings()">Persone</button>
    </div>
    ${stTab==='api'?`
      <div class="fr">
        <label class="fl">Chiave API Claude</label>
        <input class="fi" id="st-apikey" type="password" placeholder="sk-ant-…" value="${ls('cicli_claude_key')||''}">

        <button class="btn btn-ghost btn-sm ${S.ctx==='personale'?'active':''}" onclick="setCtx('personale');renderSettings()">🏠 Personale</button>
      </div>
      <div id="cat-list-st">
        ${cats.map(c=>`<div style="display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--line)">
          <span style="font-size:18px">${c.emoji||'📋'}</span>
          <span style="flex:1;font-size:13px">${H(c.nome)}</span>
          <button class="btn btn-danger btn-sm" onclick="deleteCat(${c.id})">✕</button>
        </div>`).join('')}
      </div>
      <div style="display:flex;gap:6px;margin-top:10px">
        <input class="fi" id="new-cat-nome" type="text" placeholder="Nome categoria">
        <input class="fi" id="new-cat-emoji" type="text" placeholder="📋" style="width:50px">
        <button class="btn btn-primary btn-sm" onclick="addCat()">Aggiungi</button>
      </div>
    `:`
      <div id="per-list-st">
        ${S.persone.map(p=>`<div style="display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--line)">
          <div class="pav-lg" style="width:28px;height:28px;font-size:12px;background:${pColor(p)}">${pInit(p.nome)}</div>
          <span style="flex:1;font-size:13px">${H(p.nome)} ${p.ruolo?`<span style="color:var(--muted)">${H(p.ruolo)}</span>`:''}</span>
          <button class="btn btn-danger btn-sm" onclick="deletePersona('${p.id}')">✕</button>
        </div>`).join('')}
      </div>
      <div style="display:flex;gap:6px;margin-top:10px">
        <input class="fi" id="new-per-nome" type="text" placeholder="Nome">
        <input class="fi" id="new-per-ruolo" type="text" placeholder="Ruolo">
        <button class="btn btn-primary btn-sm" onclick="addPersonaSt()">Aggiungi</button>

function saveApiKey() {
  const k = document.getElementById('st-apikey')?.value.trim();
  ls('cicli_claude_key', k);
  toast('Chiave salvata ✓', 's');
}

async function testClaude() {
  const k = document.getElementById('st-apikey')?.value.trim() || ls('cicli_claude_key');
  if (!k) { toast('Inserisci prima la chiave', 'w'); return; }
  try {
    const r = await fetch('https://api.anthropic.com/v1/messages', {
      method:'POST',headers:{'Content-Type':'application/json','x-api-key':k,'anthropic-version':'2023-06-01'},
      body:JSON.stringify({model:'claude-haiku-4-5-20251001',max_tokens:10,messages:[{role:'user',content:'ping'}]})
    });
    if (r.ok) toast('Connessione Claude OK ✓', 's'); else throw new Error(r.status);
  } catch(e) { toast('Errore connessione: '+e.message,'e'); }
}

async function addCat() {
  const nome = document.getElementById('new-cat-nome')?.value.trim();
  if (!nome) return;
  const emoji = document.getElementById('new-cat-emoji')?.value.trim() || '📋';
  await db.from('categorie').insert({ nome, emoji, ctx: S.ctx, ordine: S.categorie.length });
  await loadCategorie();
  renderSettings();
  render();
  toast('Categoria aggiunta', 's');
}

async function deleteCat(id) {
  if (!confirm('Eliminare categoria?')) return;
  await db.from('categorie').delete().eq('id', id);
  await loadCategorie();
  renderSettings();
  render();
}

async function addPersonaSt() {
  const nome = document.getElementById('new-per-nome')?.value.trim();
  if (!nome) return;
  const ruolo = document.getElementById('new-per-ruolo')?.value.trim() || '';
  await db.from('persone').insert({ nome, ruolo, contesto: S.ctx, colore: '#4f8eff' });
  await loadPersone();
  renderSettings();
}

async function deletePersona(id) {
  if (!confirm('Eliminare persona?')) return;
  await db.from('persone').delete().eq('id', id);
  await loadPersone();
  renderSettings();
}

async function addCategoriaInline() {
  const nome = prompt('Nome categoria:');
  if (!nome?.trim()) return;
  await db.from('categorie').insert({ nome:nome.trim(), emoji:'📋', ctx: S.ctx, ordine: S.categorie.length });
  await loadCategorie();
  render();
}

async function openAddPersona() {
  const nome = prompt('Nome persona:');
  if (!nome?.trim()) return;
  const ruolo = prompt('Ruolo (opzionale):') || '';
  await db.from('persone').insert({ nome:nome.trim(), ruolo, contesto: S.ctx, colore: '#4f8eff' });

  renderPersone();
}

// TOAST
// ═══════════════════════════════════════════════════
function toast(msg, type = 's') {
  const tc = document.getElementById('tc');
  const el = document.createElement('div');
  el.className = `toast ${type}`;
  el.textContent = msg;
  tc.appendChild(el);
  setTimeout(() => {
    el.classList.add('out');
    setTimeout(() => el.remove(), 250);
  }, 3000);
}

// ═══════════════════════════════════════════════════
// KEYBOARD SHORTCUTS
// ═══════════════════════════════════════════════════
document.addEventListener('keydown', e => {
  const tag = document.activeElement.tagName;
  const inInput = ['INPUT','TEXTAREA','SELECT'].includes(tag);
  if (e.key === 'Escape') {
    ['ciclo','plaud','settings'].forEach(m => {
      const el = document.getElementById('mo-' + m);
      if (!el.hasAttribute('hidden')) closeModal(m);
    });
  }
  if (inInput) return;
  if ((e.metaKey || e.ctrlKey) && e.key === 'k') { e.preventDefault(); openModalNew(); }
  if ((e.metaKey || e.ctrlKey) && e.key === 'p') { e.preventDefault(); openPlaud(); }
  if ((e.metaKey || e.ctrlKey) && e.key === 'f') { e.preventDefault(); document.getElementById('search-inp').focus(); }
  if (e.key === 'ArrowLeft' && S.view === 'lista') shiftWeek(-1);
  if (e.key === 'ArrowRight' && S.view === 'lista') shiftWeek(1);
});

// Close person dropdown on outside click
document.addEventListener('click', e => {
  const dd = document.getElementById('pp-dd');
  if (dd && !dd.contains(e.target) && !document.getElementById('pp-chips')?.contains(e.target)) {
    dd.style.display = 'none';
  }
});
